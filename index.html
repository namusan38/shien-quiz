<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>紫煙クイズ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600;800&family=Zen+Old+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: ランプの灯る書斎バー。壁の木目とランプの光の中に、革装のメニュー帳のような一枚のカードを置く。夜の店なので単一のダークテーマ */
:root{
  --bg:#120d0a;          /* 灯りの届かない壁際 */
  --wood:#1f1510;        /* ウォルナットの壁板 */
  --leather:#241912;     /* 革装のメニュー帳 */
  --leather-hi:#2e2018;
  --line:#4a3826;
  --fg:#eee2cb;          /* 古い羊皮紙 */
  --muted:#ab977b;
  --brass:#c9a45c;       /* 真鍮のプレート */
  --brass-dk:#7d5f28;
  --ink:#1c1208;
  --lamp:rgba(255,186,104,.13); /* バンカーズランプの光 */
  --ok:#a3c48c;
  --ng:#d98463;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --prose:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75;
  background-image:
    radial-gradient(ellipse 70% 45% at 50% 0%,var(--lamp),transparent 70%),
    radial-gradient(ellipse 120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.55)),
    repeating-linear-gradient(90deg,var(--wood) 0 46px,#1b120d 46px 48px,var(--wood) 48px 96px);
}
.wrap{max-width:580px;margin:0 auto;padding-block:14px 44px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;justify-content:flex-end}
.bgm{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13px;letter-spacing:.06em;cursor:pointer;
  background:rgba(0,0,0,.25);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 14px;min-height:36px}
.bgm[aria-pressed="true"]{color:var(--brass);border-color:var(--brass-dk)}
.bgm .eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.bgm .eq i{width:2px;height:4px;background:currentColor;border-radius:1px}
.bgm[aria-pressed="true"] .eq i{animation:eq 1.1s ease-in-out infinite}
.bgm .eq i:nth-child(2){animation-delay:.25s}.bgm .eq i:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.band{position:relative;text-align:center;padding:16px 18px 14px;border-radius:3px;color:var(--ink);
  background:linear-gradient(180deg,#e2c27e 0%,var(--brass) 38%,#a9853f 70%,#c9a45c 100%);
  box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,245,215,.6),inset 0 0 0 1px rgba(60,40,10,.5)}
.band::before,.band::after{content:"";position:absolute;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#f2dca6,#6e5220);box-shadow:0 1px 1px rgba(0,0,0,.4)}
.band::before{left:10px}.band::after{right:10px}
.band h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,40px);letter-spacing:.16em;line-height:1.25;
  text-shadow:0 1px 0 rgba(255,240,200,.55),0 -1px 0 rgba(60,40,10,.35)}
.band .sub{font-size:10.5px;letter-spacing:.34em;font-weight:700;opacity:.75}
.card{position:relative;background:linear-gradient(180deg,var(--leather-hi),var(--leather));border:1px solid var(--line);border-radius:4px;padding:24px 22px;
  display:flex;flex-direction:column;gap:18px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.card::before{content:"";position:absolute;inset:6px;border:1px solid rgba(201,164,92,.22);border-radius:2px;pointer-events:none}
.card>*{position:relative}
.intro h2,.result h2{margin:0;font-family:var(--display);font-weight:600;font-size:22px;line-height:1.6;text-wrap:balance}
.intro p{margin:0;color:var(--muted);font-family:var(--prose);font-size:15px}
.rule{display:flex;align-items:center;gap:12px;color:var(--brass);font-size:11px;letter-spacing:.3em}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--brass-dk),transparent)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.tag{font-size:11px;font-weight:700;letter-spacing:.12em;padding:2px 10px;border-radius:999px;border:1px solid var(--brass-dk);color:var(--brass)}
.ash{height:5px;border-radius:3px;background:#3a2b20;overflow:hidden;position:relative}
.ash i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#8d7b6c,#cdbfb0);transition:width .4s}
.ash i::after{content:"";position:absolute;right:0;top:0;bottom:0;width:6px;background:var(--ng);box-shadow:0 0 8px var(--ng)}
.qbox{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.genre{font-size:12px;font-weight:700;letter-spacing:.12em;padding:2px 10px;border:1px solid var(--brass-dk);border-radius:6px;background:rgba(201,164,92,.12);color:var(--fg)}
.q{font-family:var(--display);font-size:20px;font-weight:600;line-height:1.7;margin:0;text-wrap:pretty}
.choices{display:grid;gap:10px}
.choices.ox{grid-template-columns:1fr 1fr}
button{font:inherit;cursor:pointer}
.ch{text-align:left;background:rgba(0,0,0,.22);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:12px 14px;min-height:48px;transition:border-color .2s,background .2s}
.ox .ch{text-align:center;font-family:var(--display);font-size:34px;line-height:1;padding:16px}
.ch:hover:not(:disabled){border-color:var(--brass);background:rgba(201,164,92,.07)}
.ch:focus-visible,.btn:focus-visible,.dbtn:focus-visible,.bgm:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.ch:disabled{cursor:default}
.ch.right{border-color:var(--ok);background:rgba(163,196,140,.12)}
.ch.wrong{border-color:var(--ng);background:rgba(217,132,99,.12)}
.ch.dim{opacity:.4}
.fb{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.fb strong{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.04em}
.fb.ok strong{color:var(--ok)} .fb.ng strong{color:var(--ng)}
.fb .lbl{font-size:11px;letter-spacing:.3em;color:var(--brass)}
.fb p{margin:0;font-family:var(--prose);font-size:15px;line-height:1.9;color:var(--fg);padding-left:14px;border-left:1px solid var(--brass-dk)}
.btn{background:linear-gradient(180deg,#d6b46c,var(--brass) 50%,#a9853f);color:var(--ink);border:0;border-radius:4px;padding:14px;font-weight:700;letter-spacing:.12em;min-height:48px;
  box-shadow:inset 0 1px 0 rgba(255,245,215,.5),0 4px 12px rgba(0,0,0,.35)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1 1 140px}
.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dbtn{background:rgba(0,0,0,.22);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:14px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;min-width:0;transition:border-color .2s,background .2s}
.dbtn:hover{border-color:var(--brass);background:rgba(201,164,92,.07)}
.dbtn .dl{font-family:var(--display);font-size:20px;font-weight:800;color:var(--brass);letter-spacing:.06em}
.dbtn .ds{font-family:var(--prose);font-size:12px;color:var(--fg)}
.dbtn .dn{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rank{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0}
.rank .score{font-family:var(--display);font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.rank .score small{font-size:22px;color:var(--muted)}
.rank .name{font-family:var(--display);font-size:22px;color:var(--brass);letter-spacing:.06em}
.rank .spec{font-size:12px;color:var(--muted);letter-spacing:.08em}
.rank .say{font-family:var(--prose);font-size:15px;color:var(--fg);text-align:center;margin:6px 0 0;text-wrap:balance}
.cigar{width:100%;max-width:320px;height:26px;margin:4px 0}
.review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.review li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.review li span:last-child{min-width:0}
.review .mk{font-weight:700}
.note{font-size:12px;color:var(--muted);text-align:center;margin:0}
.best{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
/* 用語集 */
.gbtn{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;letter-spacing:.1em;font-family:var(--display);font-size:17px}
.gbtn .gcount{font-family:var(--body);font-size:12px;color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.back{align-self:flex-start;background:none;border:0;color:var(--brass);font-size:14px;padding:6px 0;min-height:36px;letter-spacing:.04em}
.gloss h2,.fresh h2{margin:0;font-family:var(--display);font-weight:600;font-size:22px}
.gprog{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.gprog b{font-family:var(--display);font-size:22px;color:var(--brass);font-weight:800}
.gprog .ash i::after{display:none}
.gprog .ash i{background:linear-gradient(90deg,var(--brass-dk),var(--brass))}
.ghint{margin:0;font-size:13px;color:var(--muted)}
.gempty{margin:8px 0;color:var(--muted);font-size:14px}
.gsearch{width:100%;font:inherit;font-size:16px;color:var(--fg);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:4px;padding:10px 12px;min-height:44px}
.gsearch::placeholder{color:var(--muted);opacity:.8}
.gsearch:focus{outline:2px solid var(--brass);outline-offset:1px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:transparent;color:var(--muted);border:0;padding:9px;min-height:40px;letter-spacing:.1em}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:rgba(201,164,92,.16);color:var(--brass);font-weight:700}
.tabs{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;margin-bottom:4px;scrollbar-width:thin}
.tab{flex:none;display:flex;align-items:baseline;gap:6px;background:rgba(0,0,0,.22);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:6px 14px;min-height:36px}
.tab small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-pressed="true"]{border-color:var(--brass);color:var(--brass);background:rgba(201,164,92,.1)}
.glist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.gi{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:baseline;background:none;color:var(--fg);border:0;border-bottom:1px solid var(--line);padding:12px 4px;min-height:48px}
button.gi:hover{background:rgba(201,164,92,.06)}
.gi .gw2{font-family:var(--display);font-size:17px;font-weight:600}
.gi .gr2{font-size:12px;color:var(--muted);min-width:0}
.gi .gs2{grid-column:1/-1;font-size:13px;color:var(--muted);font-family:var(--prose)}
.gi.locked .gw2{color:var(--muted);letter-spacing:.2em}
.grow{margin:14px 0 2px;font-size:12px;letter-spacing:.3em;color:var(--brass);font-weight:700}
.gd{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.gw{margin:4px 0 0;font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:.04em;line-height:1.3}
.gr{font-size:13px;color:var(--muted);letter-spacing:.1em;margin-top:-4px}
.gs{margin:4px 0 0;font-family:var(--display);font-size:17px;color:var(--brass)}
.ge{margin:0;font-family:var(--prose);font-size:15px;line-height:1.95;padding-left:14px;border-left:1px solid var(--brass-dk)}
.grel{display:flex;flex-direction:column;gap:8px;margin-top:8px;width:100%}
.grel .lbl,.newterm{font-size:11px;letter-spacing:.3em;color:var(--brass)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(201,164,92,.1);color:var(--fg);border:1px solid var(--brass-dk);border-radius:999px;padding:5px 14px;min-height:34px;font-size:14px}
.chip.locked{display:inline-flex;align-items:center;background:transparent;color:var(--muted);border-style:dashed;letter-spacing:.2em}
.newterm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;letter-spacing:.1em}
.fresh{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fresh h2{font-size:17px}
.term{display:inline;font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none;
  text-decoration:underline dotted var(--brass);text-underline-offset:4px;text-decoration-thickness:1.5px}
.term:hover{color:var(--brass)}
.term:focus-visible,.chip:focus-visible,.gi:focus-visible,.tab:focus-visible,.seg button:focus-visible,.back:focus-visible,.mclose:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,5,3,.72);
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
.sheet{position:relative;width:100%;max-width:520px;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:linear-gradient(180deg,var(--leather-hi),var(--leather));border:1px solid var(--brass-dk);border-radius:6px;padding:24px 22px 22px;box-shadow:0 -10px 40px rgba(0,0,0,.6)}
.mclose{position:absolute;top:8px;right:8px;width:40px;height:40px;background:none;border:0;color:var(--muted);font-size:26px;line-height:1}
html.lock,html.lock body{overflow:hidden}
@media (min-width:600px){.modal{align-items:center}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar"><button class="bgm" id="bgm" aria-pressed="false"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span id="bgmlbl">ジャズ BGM オフ</span></button></div>
  <header class="band"><div class="sub">BAR &amp; LIBRARY</div><h1>紫煙クイズ</h1><div class="sub">CIGAR · PIPE · KISERU</div></header>
  <main id="app" class="card"></main>
  <p class="note">喫煙は20歳になってから。クイズは嗜好品の文化と知識を楽しむためのものです。</p>
</div>
<div class="modal" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="gtitle"><button type="button" class="mclose" id="mclose" aria-label="閉じる">×</button><div id="mbody"></div></div></div>

<script>
const POOL=[
 {t:"4",q:"葉巻の太さを表す「リングゲージ」。1ゲージは何インチ?",c:["1/32インチ","1/64インチ","1/100インチ","1/16インチ"],a:1,e:"リングゲージ50なら直径50/64インチ(約2cm)。ロブストはこのあたりが定番です。"},
 {t:"4",q:"キューバで最高級の葉巻用タバコ産地として知られる地域は?",c:["オルギン","ヤグアハイ","ブエルタ・アバホ","バラデロ"],a:2,e:"ピナール・デル・リオ州のブエルタ・アバホ。ハバナ葉巻の名産地です。"},
 {t:"ox",q:"「コイーバ」はもともと外交用の贈答品として作られ、のちに一般発売された。",a:0,e:"国家の贈答用として生まれ、1982年に一般向けに発売されたと伝えられています。"},
 {t:"ox",q:"プレミアムシガーで知られる「モンテクリスト」は、アレキサンドル・デュマの小説「モンテ・クリスト伯」にちなんで名付けられた事で有名である。",a:0,e:"巻き手に人気だった作品から名付けられたと言われます。"},
 {t:"4",q:"葉巻工場で、作業する巻き手に新聞や小説を読み聞かせる人を何と呼ぶ?",c:["トルセドール","レクトール","カタドール","ベゲーロ"],a:1,e:"レクトール(朗読者)。巻き手そのものはトルセドールと呼ばれます。"},
 {t:"4",q:"葉巻の構造で、いちばん内側に詰められる葉は?",c:["ラッパー","バインダー","フィラー","キャップ"],a:2,e:"内側からフィラー、それを束ねるバインダー、外側を包むラッパーの順です。"},
 {t:"ox",q:"ヒュミドール管理の目安として「70/70ルール」(華氏70度・湿度70%)がよく知られている。",a:0,e:"華氏70度は約21℃。好みや季節で65%前後に下げる人もいます。"},
 {t:"ox",q:"葉巻を吸い終えるときは、灰皿で強く押しつぶして消すのがマナーとされる。",a:1,e:"灰皿に置いておけば自然に消えます。つぶすと嫌な匂いが立ちやすいので避けるのが通例です。"},
 {t:"ox",q:"パンチカッターは、葉巻の吸い口に丸い穴を開けるタイプのカッターである。",a:0,e:"ほかにまっすぐ切るギロチン、V字に切り込むVカットがあります。"},
 {t:"4",q:"先端が尖ったトルペードやベリコーソなど、円筒以外の形の葉巻の総称は?",c:["パレホ","フィギュラド","パナテラ","コロナ"],a:1,e:"フィギュラド。まっすぐな円筒形はパレホと呼ばれます。"},
 {t:"ox",q:"葉巻のサイズ名「チャーチル」は、英国首相ウィンストン・チャーチルにちなむ。",a:0,e:"葉巻を愛したことで知られるチャーチルの名を冠した、長めのサイズです。"},
 {t:"4",q:"「メシャム」パイプの主な原料の鉱物は?",c:["滑石","海泡石(セピオライト)","琥珀","大理石"],a:1,e:"ドイツ語で「海の泡」。主な産地はトルコのエスキシェヒルです。"},
 {t:"4",q:"ブライヤーパイプの材料は、どんな植物のどの部分?",c:["オリーブの幹","桜の枝","ツツジ科の木の根こぶ","竹の節"],a:2,e:"地中海沿岸のエリカ・アルボレアの根こぶ。熱に強く割れにくいのが特長です。"},
 {t:"ox",q:"コーンパイプの老舗「ミズーリ・メシャム」は、アメリカのミズーリ州にある。",a:0,e:"名前にメシャムとありますが、トウモロコシの芯で作るコーンパイプのメーカーです。"},
 {t:"4",q:"キセルで、火皿のある金属部分(雁首)と吸口をつなぐ竹の管を何と呼ぶ?",c:["羅宇","煙管","根付","火皿"],a:0,e:"羅宇(らう/らお)。ラオス産の竹が使われたことが名の由来とされます。"},
 {t:"4",q:"「ニコチン」の名の由来となった人物は?",c:["コロンブス","ジャン・ニコ","ウォルター・ローリー","ニコラ・テスラ"],a:1,e:"16世紀の駐ポルトガル・フランス大使ジャン・ニコ。タバコをフランスに紹介しました。"},
 {t:"4",q:"イングリッシュ・ミクスチャーに欠かせない、燻して乾燥させた独特の香りの葉は?",c:["ペリク","ラタキア","バーレー","オリエント"],a:1,e:"ラタキア。もとはシリアやキプロスで作られた燻製葉です。"},
 {t:"ox",q:"「ペリク」は、米国ルイジアナ州で樽に詰めて圧をかけ発酵させる希少な葉である。",a:0,e:"セント・ジェームズ郡の特産で、少量をブレンドに加えてスパイシーさを出します。"},
 {t:"4",q:"バーレー種の葉は、一般にどの方法で乾燥させる?",c:["熱風乾燥(フルーキュア)","空気乾燥(エアキュア)","天日干し(サンキュア)","燻煙乾燥(ファイアキュア)"],a:1,e:"バーレーは納屋で風を通すエアキュア。バージニアは熱風のフルーキュアが主流です。"},
 {t:"4",q:"口に含んで使う無煙タバコ「スヌース」が伝統的に親しまれている国は?",c:["スウェーデン","スペイン","トルコ","インド"],a:0,e:"スウェーデン発祥。ポーションと呼ばれる小袋入りが一般的です。"},
 {t:"ox",q:"たばこ「ピース」のパッケージは、工業デザイナーのレイモンド・ローウィが手がけた。",a:0,e:"1952年のリデザイン。濃紺地に金の鳩のデザインは今も受け継がれています。"},
 {t:"4",q:"日本専売公社が民営化され、日本たばこ産業(JT)が発足した年は?",c:["1972年","1985年","1993年","2001年"],a:1,e:"1985年4月。同じ年に日本電信電話公社もNTTになりました。"},
 {t:"ox",q:"パイプの「ダンヒル」はパリで創業されたブランドである。",a:1,e:"アルフレッド・ダンヒルがロンドンで創業。マウスピースの白い点(ホワイトスポット)が目印です。"},
 {t:"ox",q:"葉巻のラッパーで「マデューロ」は、色が淡く明るい葉を指す。",a:1,e:"マデューロは熟成で濃い茶色になった葉。淡い色はクラロ系です。"},
 {t:"4",q:"葉巻の吸い口側をふさぐように巻かれた小さな葉を何と呼ぶ?",c:["キャップ","リング","シール","フラッグ"],a:0,e:"キャップ。ここをカットして吸います。反対の火をつける側はフットと呼ばれます。"},
 {t:"4",q:"キューバ葉巻の世界的な販売・流通を担う企業は?",c:["ダビドフ","ハバノスS.A.","ジェネラル・シガー","スウェディッシュ・マッチ"],a:1,e:"ハバノスS.A.。キューバ葉巻のブランドを国外に販売しています。"},
 {t:"ox",q:"キューバ産葉巻の箱には、キューバ政府の保証シールが貼られている。",a:0,e:"緑を基調にした政府保証シールで、本物を見分ける目安のひとつです。"},
 {t:"4",q:"ヒュミドールの内張りに最もよく使われる木材は?",c:["桐","スパニッシュシダー","ヒノキ","パイン"],a:1,e:"スパニッシュシダー。湿気を保ちやすく、香りが葉巻の熟成を助けるとされます。"},
 {t:"4",q:"定番サイズ「コロナ」の標準的なリングゲージは?",c:["38","42","50","54"],a:1,e:"長さ5⅝インチ前後、リングゲージ42が基準。多くのサイズ名の基準になっています。"},
 {t:"ox",q:"葉巻は紙巻きたばこのように、煙を肺まで吸い込んで味わうのが一般的である。",a:1,e:"葉巻やパイプは煙を口に含んで香りと味を楽しむのが基本です。"},
 {t:"4",q:"葉巻ブランド「ダビドフ」が本拠を置く国は?",c:["キューバ","スペイン","スイス","オランダ"],a:2,e:"創業者ジノ・ダビドフはジュネーブの店から名を上げました。現在もスイスに本拠があります。"},
 {t:"ox",q:"ドミニカ共和国は、世界有数のプレミアムシガー生産国である。",a:0,e:"サンティアゴ周辺を中心に、世界で最も多くのプレミアムシガーを生産する国のひとつです。"},
 {t:"4",q:"ニカラグアを代表する葉巻の産地は?",c:["エステリ","コパン","サン・アンドレス","サンティアゴ"],a:0,e:"エステリ。コパンはホンジュラス、サン・アンドレスはメキシコ、サンティアゴはドミニカの産地です。"},
 {t:"4",q:"キューバで葉巻用タバコの畑(ベガ)を営む農家の呼び名は?",c:["トルセドール","レクトール","ベゲーロ","カタドール"],a:2,e:"ベゲーロ。ベガ(畑)を受け継ぎ、葉を育てる職人です。"},
 {t:"ox",q:"薄く柔らかいラッパー葉を育てるため、畑を布で覆って日差しを和らげる栽培法がある。",a:0,e:"キューバではタパードと呼ばれる日陰栽培。きめの細かい葉が育ちます。"},
 {t:"4",q:"パイプの火皿の内側にできる炭化した層を何と呼ぶ?",c:["ケーキ","パティナ","クラスト","ドッティ"],a:0,e:"ケーキ。薄く保つと火皿を守りますが、厚くなりすぎると割れの原因になるのでリーマーで削ります。"},
 {t:"ox",q:"パイプに詰めたたばこを押さえる道具を「タンパー」と呼ぶ。",a:0,e:"燃え具合を整えるために、吸いながら軽く押さえて使います。"},
 {t:"4",q:"パイプで、火皿(ボウル)と吸い口(ステム)をつなぐ木の部分は?",c:["シャンク","ビット","ヒール","リム"],a:0,e:"シャンク。ビットは口にくわえる先端、リムは火皿のふちです。"},
 {t:"ox",q:"パイプの形でいう「ベント」とは、ステムが曲がった形のことである。",a:0,e:"まっすぐなものはストレート。ベントは手を離してもくわえやすいのが利点です。"},
 {t:"4",q:"圧縮して板状にした葉を薄く切ったパイプたばこの刻み方は?",c:["リボンカット","フレーク","キューブカット","シャグ"],a:1,e:"フレーク。ほぐしたり折りたたんだりして詰め、ゆっくり燃えるのが特長です。"},
 {t:"ox",q:"江戸時代のキセル用の刻みたばこは、髪の毛ほどの細さに刻まれていた。",a:0,e:"日本の細刻みは世界でも珍しいほど細く、数服で吸い切るキセルの文化を支えました。"},
 {t:"4",q:"たばこが日本に伝わったとされるのはいつごろ?",c:["平安時代","鎌倉時代","16世紀末ごろ","明治時代"],a:2,e:"16世紀末ごろ、ポルトガル人などとの南蛮貿易を通じて伝わったとされます。"},
 {t:"ox",q:"コロンブスの一行は、アメリカ大陸の先住民がたばこを吸う姿を記録したヨーロッパ人として知られる。",a:0,e:"1492年の航海で、先住民が葉を巻いて吸う様子が記録されています。"},
 {t:"4",q:"たばこ(Nicotiana tabacum)は何科の植物?",c:["ナス科","アブラナ科","キク科","マメ科"],a:0,e:"ナス科。トマトやジャガイモ、ナスと同じ仲間です。"},
 {t:"4",q:"糖蜜やグリセリンで湿らせた、水たばこ(シーシャ)用のたばこを何と呼ぶ?",c:["ラタキア","ムアッセル","スヌース","ペリク"],a:1,e:"ムアッセル。フルーツなどで香りづけされたものが主流です。"},
 {t:"ox",q:"水たばこ(シーシャ)は、炭の火で葉を直接燃やして吸うものである。",a:1,e:"炭はアルミホイルなどの上に置き、その熱でたばこを蒸らすように加熱します。"},
 {t:"ox",q:"葉巻にマッチで火をつけるときは、着火直後の硫黄が燃え切ってから使うとよいとされる。",a:0,e:"硫黄の匂いが葉巻に移らないよう、炎が落ち着くのを待つのが通例です。"},
 {t:"4",q:"オイルライター「ジッポー」が誕生した場所は?",c:["ニューヨーク州ブルックリン","ペンシルベニア州ブラッドフォード","ケンタッキー州ルイビル","バージニア州リッチモンド"],a:1,e:"1932年、ペンシルベニア州ブラッドフォードで生まれました。"},
 {t:"4",q:"明治時代に「天狗たばこ」で一世を風靡した実業家は?",c:["村井吉兵衛","岩谷松平","渋沢栄一","岩崎弥太郎"],a:1,e:"岩谷松平。派手な宣伝で、ライバルの村井吉兵衛と激しく競いました。"},
 {t:"ox",q:"日本でたばこの専売制度が始まったのは明治時代である。",a:0,e:"1898年に葉たばこの専売、1904年に製造も含めた専売が始まりました。"},
 {g:"葉巻",t:"4",q:"「パルタガス セリーD No.4」はどのサイズの代表格?",c:["コロナ","ロブスト","チャーチル","パナテラ"],a:1,e:"ロブストの定番として、世界中の愛好家に知られる1本です。"},
 {g:"葉巻",t:"4",q:"「モンテクリスト No.2」は、どんな形の葉巻?",c:["先が尖ったトルペード","細長いパナテラ","太く短いロブスト","円筒形のコロナ"],a:0,e:"キューバではピラミデとも呼ばれる、先端が尖った形の名作です。"},
 {g:"葉巻",t:"ox",q:"「パナテラ」は、太く短い葉巻のサイズ名である。",a:1,e:"パナテラは細長いサイズ。軽やかに吸えるのが持ち味です。"},
 {g:"葉巻",t:"4",q:"キューバ葉巻の箱に記される、完全な手巻きを示すスペイン語表記は?",c:["Totalmente a mano","Hecho a máquina","Puro natural","Gran reserva"],a:0,e:"「すべて手で」の意味。キューバのプレミアムシガーの証です。"},
 {g:"葉巻",t:"ox",q:"葉巻の灰が長く崩れずに保たれるのは、一般に巻きの良さのしるしとされる。",a:0,e:"フィラーが均一に詰まっていると、灰がしっかりと長く残ります。"},
 {g:"葉巻",t:"4",q:"ブランド名「オヨ・デ・モントレー」の「オヨ(Hoyo)」の意味は?",c:["王冠","窪地","川","丘"],a:1,e:"スペイン語で穴や窪地のこと。ブエルタ・アバホの畑の地形に由来します。"},
 {g:"パイプ",t:"4",q:"パイプで、本格的に火をつける前に表面を軽くあぶる最初の点火を何と呼ぶ?",c:["チャーリングライト","トゥルーライト","ドライボックス","リライト"],a:0,e:"チャーリングライトで表面を焦がして整え、タンパーで押さえてから本点火します。"},
 {g:"パイプ",t:"ox",q:"パイプは吸い終わったら、熱いうちにすぐステムを抜いて掃除するのがよい。",a:1,e:"熱いうちに抜くとシャンクを傷めやすいので、冷めてから外すのが基本です。"},
 {g:"パイプ",t:"4",q:"「チャーチワーデン」と呼ばれるパイプの特徴は?",c:["とても長いステム","陶器の火皿","二重の火皿","金属製のボウル"],a:0,e:"30cm前後にもなる長いステムで、煙が冷えて口当たりが柔らかくなります。"},
 {g:"パイプ",t:"ox",q:"パイプは複数本を持ち、1本ずつ休ませながらローテーションするとよいとされる。",a:0,e:"使ったあと1日以上休ませると、湿気が抜けて味が落ちにくくなります。"},
 {g:"パイプ",t:"4",q:"パイプブランド「スタンウェル」はどこの国のメーカー?",c:["イギリス","イタリア","デンマーク","アメリカ"],a:2,e:"デンマーク。自由な造形のデニッシュパイプの代表的なブランドです。"},
 {g:"パイプ",t:"4",q:"パイプの掃除に使う、針金に綿を巻いたブラシの日本での通称は?",c:["モール","リーマー","タンパー","スピル"],a:0,e:"モール(パイプクリーナー)。ステムやシャンクの中の湿気やヤニを取ります。"},
 {g:"キセル",t:"4",q:"羅宇を使わず、全体が一本の金属でできたキセルを何と呼ぶ?",c:["延べ煙管","羅宇煙管","長煙管","刻み煙管"],a:0,e:"延べ煙管。丈夫で、装飾を凝らしたものも多く作られました。"},
 {g:"キセル",t:"ox",q:"「たばこ盆」は、火入れや灰吹きなどをのせた喫煙道具一式の台である。",a:0,e:"客をもてなす道具でもあり、座敷に置かれていました。"},
 {g:"キセル",t:"4",q:"たばこ盆で、キセルの灰を落とす竹筒を何と呼ぶ?",c:["火入れ","灰吹き","根付","煙草入れ"],a:1,e:"灰吹き。キセルの雁首を縁に軽く当てて灰を落とします。"},
 {g:"キセル",t:"ox",q:"腰に提げるたばこ入れを帯に留めるための小さな留め具が「根付」である。",a:0,e:"根付は精巧な彫刻が施されたものも多く、美術品として集められています。"},
 {g:"たばこ葉",t:"4",q:"トルコやギリシャなどで育つ、香り高い小ぶりな葉の総称は?",c:["オリエント葉","バーレー葉","バージニア葉","ペリク"],a:0,e:"オリエント葉。アメリカンブレンドの紙巻きにも香りづけとして使われます。"},
 {g:"たばこ葉",t:"ox",q:"バージニア葉は、糖分が多く甘みのある味わいが特徴とされる。",a:0,e:"熱風乾燥(フルーキュア)で糖分が残り、明るい色と甘みが出ます。"},
 {g:"たばこ葉",t:"4",q:"葉を加熱・圧縮して甘く柔らかに仕上げた、パイプたばこの製法の名前は?",c:["キャベンディッシュ","ラタキア","フレーク","シャグ"],a:0,e:"キャベンディッシュ。黒っぽく、着香されたものも多いのが特徴です。"},
 {g:"シーシャ",t:"4",q:"水たばこ(シーシャ)の、トルコでの一般的な呼び名は?",c:["ナルギレ","フーカー","スヌース","パイプ"],a:0,e:"ナルギレ。英語圏ではフーカー、アラブ圏ではシーシャと呼ばれることが多いです。"},
 {g:"シーシャ",t:"ox",q:"シーシャの加熱には、ヤシ殻から作るココナッツ炭がよく使われる。",a:0,e:"火力が安定し、匂いが少ないのが好まれる理由です。"},
 {g:"喫煙具",t:"4",q:"高級ライター「エス・テー・デュポン」はどこの国のブランド?",c:["イタリア","フランス","スイス","ドイツ"],a:1,e:"フランス。パリで生まれたラグジュアリーブランドです。"},
 {g:"喫煙具",t:"ox",q:"デュポンのライターは、ふたを開けたときの澄んだ金属音で知られる。",a:0,e:"「キーン」という開閉音は、ブランドの象徴として大切にされています。"},
 {g:"歴史",t:"4",q:"19世紀後半に、紙巻きたばこの自動巻上機を発明したのは?",c:["ジェームズ・ボンサック","ジェームズ・デューク","ジャン・ニコ","アルフレッド・ダンヒル"],a:0,e:"ボンサックの機械で大量生産が可能になり、紙巻きは瞬く間に世界へ広まっていきました。"},
 {g:"歴史",t:"ox",q:"イングランド王ジェームズ1世は、たばこを批判する小冊子を書いたことで知られる。",a:0,e:"1604年の『たばこへの反論』。国王自ら喫煙を戒めた文書です。"},
 {g:"葉巻",t:"4",q:"葉巻の主な原料は?",c:["たばこの葉","紙","茶葉","麻"],a:0,e:"葉巻は中身から外側まで、すべてたばこの葉でできています。"},
 {g:"葉巻",t:"ox",q:"葉巻は英語で「シガー」と呼ばれる。",a:0,e:"cigar。紙巻きたばこは cigarette(シガレット)です。"},
 {g:"葉巻",t:"4",q:"葉巻の吸い口を切るための道具は?",c:["シガーカッター","タンパー","リーマー","モール"],a:0,e:"シガーカッター。タンパー、リーマー、モールはパイプの道具です。"},
 {g:"葉巻",t:"ox",q:"葉巻は紙巻きたばこと同じく、たばこの葉を紙で巻いて作られる。",a:1,e:"葉巻はいちばん外側もたばこの葉(ラッパー)で巻かれています。"},
 {g:"葉巻",t:"4",q:"キューバ葉巻の代名詞にもなっている、キューバの首都は?",c:["ハバナ","サンティアゴ・デ・クーバ","マイアミ","マドリード"],a:0,e:"ハバナ。キューバ葉巻は「ハバナ葉巻」とも呼ばれます。"},
 {g:"葉巻",t:"ox",q:"葉巻を湿度を保って保管するための箱を「ヒュミドール」と呼ぶ。",a:0,e:"乾燥すると味が落ちるので、湿度を一定に保って保管します。"},
 {g:"葉巻",t:"4",q:"葉巻に巻かれている、ブランド名入りの紙の帯を何と呼ぶ?",c:["シガーバンド","キャップ","フット","ラッパー"],a:0,e:"シガーバンド(リング)。ブランドや銘柄を見分ける目印です。"},
 {g:"パイプ",t:"4",q:"パイプで、たばこの葉を詰める部分は?",c:["ボウル(火皿)","ステム","シャンク","ビット"],a:0,e:"ボウル。ここに葉を詰めて火をつけます。"},
 {g:"パイプ",t:"ox",q:"コーンパイプは、トウモロコシの芯(穂軸)で作られている。",a:0,e:"軽くて安価なので、パイプの入門用としても人気です。"},
 {g:"パイプ",t:"4",q:"パイプで、口にくわえる側の細長い部分を何と呼ぶ?",c:["ステム","ボウル","リム","ヒール"],a:0,e:"ステム(マウスピース)。先端の口に当たる部分はビットと呼ばれます。"},
 {g:"キセル",t:"4",q:"「キセル」を漢字で書くと?",c:["煙管","煙草","喫管","吸筒"],a:0,e:"煙管。「煙草」は「たばこ」と読みます。"},
 {g:"キセル",t:"ox",q:"キセルは、一度にたくさんの葉を詰めて長時間吸う道具である。",a:1,e:"火皿は小さく、数服で吸い切っては詰め直して楽しみます。"},
 {g:"たばこ葉",t:"ox",q:"たばこの葉は、収穫後すぐには使わず、乾燥・熟成させてから使う。",a:0,e:"乾燥と熟成を経ることで、香りや味わいがまろやかになります。"},
 {g:"たばこ葉",t:"4",q:"たばこの葉に含まれ、依存性の原因となる成分は?",c:["ニコチン","カフェイン","タンニン","カテキン"],a:0,e:"ニコチン。カフェインはコーヒー、カテキンは緑茶に多い成分です。"},
 {g:"たばこ葉",t:"ox",q:"たばこは、もともとアメリカ大陸原産の植物である。",a:0,e:"南北アメリカが原産で、大航海時代に世界へ広まりました。"},
 {g:"シーシャ",t:"4",q:"シーシャで、煙をくぐらせて冷やすために容器に入れるものは?",c:["水","油","酒","砂"],a:0,e:"水。水たばこと呼ばれる理由です。"},
 {g:"シーシャ",t:"ox",q:"シーシャは、ホースを回して複数人で楽しむこともある。",a:0,e:"仲間と囲んでゆっくり楽しむ社交の道具でもあります。"},
 {g:"喫煙具",t:"4",q:"ガスやオイルを燃料にして火をつける道具は?",c:["ライター","タンパー","ヒュミドール","カッター"],a:0,e:"ライター。葉巻には炎の強いターボライターもよく使われます。"},
 {g:"喫煙具",t:"ox",q:"ジッポーは、主にガスを燃料にするライターである。",a:1,e:"ジッポーはオイルライター。綿に染み込ませたオイルを芯で吸い上げて燃やします。"},
 {g:"喫煙具",t:"4",q:"葉巻の点火に使われる、スギの薄い木片を何と呼ぶ?",c:["シダースピル","マッチ","モール","リーマー"],a:0,e:"シダースピル。箱に入っている仕切りの杉板を細く裂いて使うこともあります。"},
 {g:"歴史",t:"4",q:"「JT」は何の略?",c:["Japan Tobacco","Japan Trade","Japan Tea","Japan Travel"],a:0,e:"日本たばこ産業の英語名、Japan Tobacco Inc. の略です。"},
 {g:"マナー",t:"4",q:"日本の法律で、たばこを吸えるのは何歳から?",c:["18歳","20歳","21歳","16歳"],a:1,e:"20歳から。成年年齢は18歳に引き下げられましたが、喫煙と飲酒は20歳のままです。"},
 {g:"マナー",t:"ox",q:"改正健康増進法の全面施行(2020年4月)で、飲食店などは原則として屋内禁煙になった。",a:0,e:"喫煙専用室などを設けた場合を除き、多くの人が使う施設の屋内は原則禁煙です。"},
 {g:"マナー",t:"ox",q:"歩きながらたばこを吸う「歩きたばこ」は、多くの自治体で条例により禁止・規制されている。",a:0,e:"東京の千代田区など、路上喫煙に罰則つきで禁止区域を設けている自治体もあります。"},
 {g:"マナー",t:"ox",q:"葉巻やパイプは、たばこ製品には含まれない。",a:1,e:"葉巻もパイプたばこも、法律上はたばこ製品です。"},
 // ここから全150問化で追加(d: 1=簡単 2=普通 3=難しい)
 {d:1,g:"葉巻",t:"ox",q:"葉巻は、キューバの名産品として有名である。",a:0,e:"ハバナ葉巻は世界中の愛好家に知られるキューバの代表的な特産品です。"},
 {d:1,g:"葉巻",t:"4",q:"葉巻で、火をつける側の先端を何と呼ぶ?",c:["フット","キャップ","バンド","ラッパー"],a:0,e:"フット。反対側の吸い口はヘッドで、そこをふさいでいる葉がキャップです。"},
 {d:1,g:"葉巻",t:"ox",q:"プレミアムシガーには、1本ずつ手で巻かれたものが多い。",a:0,e:"高級な葉巻の多くは、熟練の巻き手による手巻きです。"},
 {d:1,g:"パイプ",t:"ox",q:"パイプたばこは、パイプの火皿に詰めて火をつけて吸う。",a:0,e:"葉を火皿に詰め、ゆっくり燃やして香りを楽しみます。"},
 {d:1,g:"パイプ",t:"4",q:"パイプを愛用したことで有名な、小説の名探偵は?",c:["シャーロック・ホームズ","エルキュール・ポアロ","明智小五郎","金田一耕助"],a:0,e:"ホームズ。難事件を「パイプ3服分の問題」と呼ぶ場面もあります。"},
 {d:1,g:"キセル",t:"ox",q:"キセルは、日本の伝統的な喫煙具である。",a:0,e:"江戸時代に広く普及し、刻みたばこを詰めて吸いました。"},
 {d:1,g:"歴史",t:"4",q:"たばこ「キャメル」のパッケージに描かれている動物は?",c:["ラクダ","ゾウ","ライオン","ウマ"],a:0,e:"キャメルは英語でラクダ。ヒトコブラクダの絵がトレードマークです。"},
 {d:1,g:"歴史",t:"4",q:"たばこ「アメリカンスピリット」のパッケージに描かれている人物は?",c:["パイプをくわえたネイティブアメリカン","帽子をかぶったカウボーイ","ひげの船乗り","ヨーロッパの貴族"],a:0,e:"羽根飾りをつけたネイティブアメリカンが、長いパイプをくわえる姿が描かれています。"},
 {d:1,g:"葉巻",t:"ox",q:"葉巻は、吸い口をカットしてから火をつけるのが一般的である。",a:0,e:"吸い口はキャップでふさがれているので、カッターで開けてから火をつけます。"},
 {d:1,g:"パイプ",t:"ox",q:"パイプは木だけでなく、トウモロコシの芯や鉱物など、さまざまな素材で作られる。",a:0,e:"ブライヤー(木)、コーン(トウモロコシ)、メシャム(鉱物)などがあります。"},
 {d:1,g:"喫煙具",t:"ox",q:"ガスライターの燃料には、主にブタンガスが使われる。",a:0,e:"ブタンガス。葉巻用のライターも、ほとんどがブタンガスを使います。"},
 {d:1,g:"歴史",t:"4",q:"たばこ「ラッキーストライク」のパッケージで有名なマークは?",c:["赤い丸","青い星","金の鳩","緑の三角"],a:0,e:"白地に赤い丸のマーク。的(まと)のようなデザインで知られます。"},
 {d:1,g:"歴史",t:"4",q:"たばこ「ピース」のパッケージに描かれている鳥は?",c:["ハト","ワシ","ツル","カラス"],a:0,e:"平和(ピース)の象徴であるハトが、オリーブの枝をくわえています。"},
 {d:1,g:"歴史",t:"4",q:"たばこ「マイルドセブン」は、2013年に何という名前に変わった?",c:["メビウス","セブンスター","ピアニッシモ","ケント"],a:0,e:"メビウス(MEVIUS)。マイルドセブンのMとSevenのVを受け継いだ名前です。"},
 {d:1,g:"歴史",t:"ox",q:"「ハイライト」は、日本で発売されているたばこの銘柄である。",a:0,e:"1960年発売のロングセラー。あの青いパッケージに、懐かしさを覚える方も多いでしょう。"},
 {d:1,g:"マナー",t:"ox",q:"加熱式たばこも、改正健康増進法の規制の対象になっている。",a:0,e:"加熱式たばこも屋内では原則禁煙です。専用の喫煙室なら飲食しながら吸える場合もあります。"},
 {d:1,g:"たばこ葉",t:"4",q:"収穫して乾燥させたたばこの葉は、主に何色になる?",c:["茶色","青色","白色","赤色"],a:0,e:"緑の葉は乾燥と熟成で、黄色から茶色に変わっていきます。"},
 {d:2,g:"葉巻",t:"4",q:"太く短い葉巻のサイズの代表は?",c:["ロブスト","パナテラ","ランセロ","ペティコロナ"],a:0,e:"ロブスト。太さのわりに短く、30〜45分ほどで濃い味を楽しめます。"},
 {d:2,g:"葉巻",t:"ox",q:"葉巻は、湿度が高すぎるとカビが生えることがある。",a:0,e:"高すぎても低すぎてもよくないので、ヒュミドールで湿度を一定に保ちます。"},
 {d:2,g:"葉巻",t:"4",q:"葉巻ブランド「H.アップマン」の創業者ヘルマン・アップマンの本業は?",c:["銀行家","医師","船長","画家"],a:0,e:"ドイツの銀行家で、ハバナに支店を開き、のちに葉巻工場を立ち上げました。"},
 {d:2,g:"パイプ",t:"4",q:"パイプの火皿にたまったケーキを削る道具は?",c:["リーマー","タンパー","モール","カッター"],a:0,e:"リーマー。ケーキを薄く保つことで火皿の割れを防ぎます。"},
 {d:2,g:"パイプ",t:"ox",q:"湿りすぎたパイプたばこは、詰める前に少し乾かすと燃えやすくなる。",a:0,e:"広げて少し置くと、火がつきやすく舌を荒らしにくくなります。"},
 {d:2,g:"キセル",t:"4",q:"キセルで、たばこを詰める火皿がついた先端の金属部分を何と呼ぶ?",c:["雁首","羅宇","吸口","根付"],a:0,e:"雁首(がんくび)。形が雁の首に似ていることから名付けられました。"},
 {d:2,g:"たばこ葉",t:"4",q:"バージニア、バーレー、オリエントの葉を混ぜた紙巻きたばこのブレンドを何と呼ぶ?",c:["アメリカンブレンド","イングリッシュミクスチャー","バージニアストレート","ラタキアブレンド"],a:0,e:"アメリカンブレンド。日本の紙巻きたばこにも多いタイプです。"},
 {d:2,g:"喫煙具",t:"4",q:"オイルライター「ジッポー」が掲げている製品保証は?",c:["永久保証","1年保証","10年保証","保証なし"],a:0,e:"永久保証。使用年数を問わず修理を受け付けることで知られています。"},
 {d:2,g:"歴史",t:"4",q:"日本語の「たばこ」は、主に何語から来た言葉とされる?",c:["ポルトガル語","英語","オランダ語","中国語"],a:0,e:"ポルトガル語の tabaco から。南蛮貿易とともに伝わりました。"},
 {d:2,g:"マナー",t:"ox",q:"葉巻の灰は、こまめに落とすほど上品とされる。",a:1,e:"灰はある程度残したままにしておくのが一般的。灰が火の温度を保ち、燃焼を安定させます。"},
 {d:3,g:"葉巻",t:"4",q:"コイーバの代表作としても知られる、細長いサイズは?",c:["ランセロ","ロブスト","ピラミデ","ペティコロナ"],a:0,e:"ランセロ。長さ約19cm、リングゲージ38の細く長いサイズです。"},
 {d:3,g:"葉巻",t:"4",q:"コイーバ誕生の地として知られる、ハバナの葉巻工場は?",c:["エル・ラギート","パルタガス","ラ・コロナ","H.アップマン"],a:0,e:"エル・ラギート。もとは邸宅だった建物で、コイーバの生産が始まりました。"},
 {d:3,g:"葉巻",t:"4",q:"「コイーバ・ベヒーケ」に使われる、株の最上部にできる希少な葉は?",c:["メディオ・ティエンポ","ボラード","セコ","カンデラ"],a:0,e:"メディオ・ティエンポ。すべての株にできるわけではない、とても希少な葉です。"},
 {d:3,g:"葉巻",t:"4",q:"キューバ葉巻の「エディシオン・レヒオナル」とは?",c:["特定の国や地域向けの限定品","機械巻きの普及品","工場見学の限定品","ラッパーを巻かない葉巻"],a:0,e:"国や地域ごとの販売代理店向けに作られる限定品で、専用のバンドがつきます。"},
 {d:3,g:"パイプ",t:"4",q:"ダンヒルのパイプで、黒いサンドブラスト仕上げのラインは?",c:["シェル","ブリュイエール","ルートブライヤー","タンシェル"],a:0,e:"シェル。ブリュイエールは赤みのあるなめらかな仕上げのラインです。"},
 {d:3,g:"パイプ",t:"ox",q:"パイプメーカーの「ピーターソン」は、アイルランドのメーカーである。",a:0,e:"ダブリンで創業。独特の構造の「システム」パイプで知られます。"},
 {d:3,g:"パイプ",t:"4",q:"ピーターソンが考案した、煙を上向きに出すマウスピースの形は?",c:["Pリップ","フィッシュテール","サドル","テーパー"],a:0,e:"Pリップ。煙が舌に直接当たらないよう、上に向けて出る作りです。"},
 {d:3,g:"たばこ葉",t:"ox",q:"オリエント葉は、主に天日干し(サンキュア)で乾燥させる。",a:0,e:"強い日差しで乾かすことで、独特の香りが生まれます。"},
 {d:3,g:"歴史",t:"4",q:"WHOの「たばこ規制枠組条約」が発効した年は?",c:["2005年","1995年","2015年","1985年"],a:0,e:"2005年。日本も締約国になっています。"},
 {d:3,g:"歴史",t:"4",q:"WHOが定める「世界禁煙デー」は何月何日?",c:["5月31日","4月1日","10月10日","12月1日"],a:0,e:"5月31日。日本ではこの日から1週間が禁煙週間です。"},
 // ---- 新ジャンル「海外」「逸話」「用語」 各10問 ----
 {d:2,g:"海外",t:"4",q:"フランスのたばこ屋の店先に掲げられている、赤い菱形の看板の通称は?",c:["キャロット","ブション","ガレット","シトロン"],a:0,e:"「キャロット(にんじん)」と呼ばれます。かつて刻みたばこの湿り気を保つためににんじんを入れていた習わしが、名の由来と言われています。"},
 {d:2,g:"海外",t:"4",q:"インドネシアの「クレテック」に、たばこと一緒に混ぜられている香辛料は?",c:["クローブ","シナモン","カルダモン","ナツメグ"],a:0,e:"クローブ(丁子)です。火をつけるとパチパチと音を立てることから、その音にちなんで名付けられたと言われています。"},
 {d:3,g:"海外",t:"4",q:"インドの細巻きたばこ「ビディ」で、刻みたばこを巻くのに使われるものは?",c:["テンドゥの葉","バナナの葉","トウモロコシの皮","ヤシの葉"],a:0,e:"黒檀の仲間であるテンドゥの葉で巻き、糸で縛って留めます。小ぶりで素朴な一本で、インドでは古くから庶民に親しまれてきました。"},
 {d:2,g:"海外",t:"4",q:"ゴロワーズやジタンに代表される、フランスの伝統的な「黒たばこ」の葉の特徴は?",c:["空気乾燥させた濃い色の葉","熱風乾燥させた明るい色の葉","煙でいぶして乾かした葉","日陰で育てた若い葉"],a:0,e:"空気乾燥させた濃い色の葉を使い、力強く香ばしい味わいになります。フランスでは「タバ・ブラン(茶色のたばこ)」と呼ばれてきました。"},
 {d:3,g:"海外",t:"4",q:"フランスのたばこ「ジタン」のパッケージを長く飾ってきた図柄は?",c:["踊る女性のシルエット","翼のついたかぶと","おんどり","帆船"],a:0,e:"ジタンとは「ジプシーの女性たち」の意味で、踊る女性の姿が描かれてきました。翼のついたかぶとはゴロワーズの図柄です。なお、フランスでは2017年からたばこのパッケージの無地化が義務づけられています。"},
 {d:2,g:"海外",t:"ox",q:"キューバの葉巻ブランド「ロメオ・イ・フリエタ」は、シェイクスピアの戯曲『ロミオとジュリエット』にちなんで名付けられた。",a:0,e:"正解は○。1875年に創業した、ハバナを代表する老舗ブランドのひとつです。バンドやロゴにも、物語にちなんだ意匠が使われています。"},
 {d:2,g:"海外",t:"ox",q:"「マールボロ」は、もともと女性向けのたばことして売り出された歴史がある。",a:0,e:"正解は○。1920年代には「5月のようにマイルド」をうたう女性向けの銘柄でした。カウボーイの広告で男性的なイメージに生まれ変わったのは、1950年代のことです。"},
 {d:3,g:"海外",t:"ox",q:"「ラッキーストライク」のパッケージは、第二次世界大戦中に緑色から白色へ変わった。",a:0,e:"正解は○。1942年、「ラッキーストライクの緑は戦争に行った」という広告とともに白地に改められました。緑の染料に使う材料が戦時中に不足したため、と説明されています。"},
 {d:2,g:"海外",t:"ox",q:"フランスのたばこ屋では、たばこのほかに切手や宝くじなどを扱っていることが多い。",a:0,e:"正解は○。たばこ屋は町の小さな窓口のような存在です。カフェを兼ねた店も多く、旅先では赤い看板を探すと何かと重宝します。"},
 {d:3,g:"海外",t:"ox",q:"「キャメル」は、トルコ産のオリエント葉を配合したブレンドとして売り出された。",a:0,e:"正解は○。1913年に、トルコ葉とアメリカ産の葉を合わせたブレンドとして登場しました。パッケージのラクダも、オリエントの香りを印象づけるためのものです。"},
 {d:2,g:"逸話",t:"4",q:"ルネ・マグリットの絵画『イメージの裏切り』で、パイプの絵の下に書かれている言葉は?",c:["これはパイプではない","これは夢である","これは絵にすぎない","パイプを吸うべからず"],a:0,e:"「これはパイプではない」と書かれています。描かれたものはあくまで絵であって、本物のパイプではない、という問いかけです。"},
 {d:3,g:"逸話",t:"4",q:"葉巻を愛したフィデル・カストロが、葉巻をやめたと公にしたのは何年?",c:["1985年","1959年","1972年","2000年"],a:0,e:"1985年です。健康のためと語り、国民の禁煙を促す意味もあったとされています。コイーバ誕生の逸話とあわせて、よく語られる話です。"},
 {d:3,g:"逸話",t:"4",q:"シャーロック・ホームズが刻みたばこをしまっていた場所として描かれているのは?",c:["ペルシャ製スリッパのつま先","帽子の中","地球儀の中","石炭入れ"],a:0,e:"ペルシャ製スリッパのつま先です。葉巻のほうは石炭入れにしまっていたと描かれており、ホームズの無頓着ぶりを伝える有名な一節です。"},
 {d:3,g:"逸話",t:"4",q:"パイプを愛したアインシュタインが、1950年に終身会員になったとされる団体は?",c:["モントリオールのパイプ愛好家クラブ","ロンドンの葉巻クラブ","ベルンのたばこ研究会","プリンストンの喫煙者協会"],a:0,e:"モントリオールのパイプ愛好家クラブと言われています。その際、パイプは落ち着いた判断の助けになる、という趣旨の言葉を寄せたとも伝えられます。"},
 {d:2,g:"逸話",t:"4",q:"「葉巻はときに、ただの葉巻にすぎない」という言葉。一般に誰の言葉として広まっている?",c:["フロイト","チャーチル","カストロ","マーク・トウェイン"],a:0,e:"精神分析のフロイトの言葉として広く知られています。ただ、本人の著作や確かな記録には見当たらず、実際の出典ははっきりしていません。"},
 {d:3,g:"逸話",t:"ox",q:"「禁煙なんて簡単だ、何度もやってきた」という趣旨の言葉は、マーク・トウェインの著作に記録が確認されている。",a:1,e:"正解は×。トウェインの言葉として有名ですが、本人の著作や記録には確認されていません。名言は、ときに持ち主を変えて広まっていくものです。"},
 {d:1,g:"逸話",t:"ox",q:"漫画のキャラクター「ポパイ」は、コーンパイプをくわえている。",a:0,e:"正解は○。いつも口元にコーンパイプをくわえた姿で描かれています。素朴なコーンパイプは、船乗りや労働者の象徴でもありました。"},
 {d:2,g:"逸話",t:"ox",q:"1945年、マッカーサーはコーンパイプをくわえた姿で厚木飛行場に降り立った。",a:0,e:"正解は○。サングラスにコーンパイプという姿は、終戦直後の日本で強い印象を残しました。コーンパイプは彼のトレードマークとして知られています。"},
 {d:2,g:"逸話",t:"ox",q:"ゴッホは、パイプをくわえた自画像を描いている。",a:0,e:"正解は○。1889年の『耳に包帯をしてパイプをくわえた自画像』がよく知られています。ゴッホはパイプを愛し、パイプそのものも静物画に描きました。"},
 {d:3,g:"逸話",t:"ox",q:"芥川龍之介には、『煙草と悪魔』という短編小説がある。",a:0,e:"正解は○。たばこは悪魔が日本に持ち込んだもの、という奇想を描いた作品です。たばこ伝来の歴史を下敷きにした、軽妙な一編です。"},
 {d:2,g:"用語",t:"4",q:"パイプの愛好家が言う「ゴースト」とは?",c:["前に吸ったたばこの香りが残ること","火が途中で消えてしまうこと","煙が白く濃く出ること","灰が崩れずに残ること"],a:0,e:"前に詰めたたばこの香りが、パイプに残って次の一服に混じることです。香りの強い着香たばこはゴーストが残りやすく、専用のパイプを分ける愛好家もいます。"},

const GMAP=Object.fromEntries(GLOSSARY.map(t=>[t.id,t]));
const GCATS=["葉巻","パイプ","キセル","葉","道具","シーシャ","歴史"];
const KANAROWS=[["あ","あいうえおぁぃぅぇぉ"],["か","かきくけこがぎぐげご"],["さ","さしすせそざじずぜぞ"],["た","たちつてとだぢづでどっ"],["な","なにぬねの"],["は","はひふへほばびぶべぼぱぴぷぺぽ"],["ま","まみむめも"],["や","やゆよゃゅょ"],["ら","らりるれろ"],["わ","わをん"]];
const kanaRow=r=>(KANAROWS.find(x=>x[1].includes(r[0]))||["他"])[0];
const toHira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const byKana=(a,b)=>a.r.localeCompare(b.r,"ja");
let unlocked=new Set((()=>{try{return JSON.parse(store.get("kemuri-gloss")||"[]")}catch(e){return []}})().filter(id=>GMAP[id]));
let freshTerms=[]; // 今回のプレイで新しく解放された用語
const gl={mode:"cat",cat:"葉巻",query:"",detail:null};
function unlockFrom(q){
  const text=[q.q,...(q.c||[]),q.e].join(" "), added=[];
  GLOSSARY.forEach(t=>{if(!unlocked.has(t.id)&&text.includes(t.w)){unlocked.add(t.id);added.push(t.id)}});
  if(added.length){freshTerms.push(...added);store.set("kemuri-gloss",JSON.stringify([...unlocked]))}
  return added;
}
// 解放済みの用語に点線の下線をつけ、タップで小窓を開けるようにする
function markup(text){
  const list=GLOSSARY.filter(t=>unlocked.has(t.id)).sort((a,b)=>b.w.length-a.w.length);
  const s=esc(text); if(!list.length)return s;
  const ids=Object.fromEntries(list.map(t=>[esc(t.w),t.id]));
  const re=new RegExp(list.map(t=>esc(t.w).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"),"g");
  return s.replace(re,m=>`<button type="button" class="term" data-term="${ids[m]}">${m}</button>`);
}
function chipHTML(id,attr){const t=GMAP[id];return unlocked.has(id)?`<button type="button" class="chip" ${attr}="${id}">${esc(t.w)}</button>`:`<span class="chip locked">？？？</span>`}
function detailHTML(t,attr){
  return `<div class="gd"><span class="genre">${t.cat}</span>
  <h3 class="gw" id="gtitle">${esc(t.w)}</h3><div class="gr">${esc(t.r)}</div>
  <p class="gs">${esc(t.s)}</p><p class="ge">${esc(t.e)}</p>
  ${t.rel.length?`<div class="grel"><span class="lbl">関連用語</span><div class="chips">${t.rel.map(id=>chipHTML(id,attr)).join("")}</div></div>`:""}</div>`;
}
function glossCount(){return GLOSSARY.filter(t=>unlocked.has(t.id)).length}
function glossary(){gl.detail=null;renderGloss();window.scrollTo(0,0)}
function renderGloss(){
  app.className="card gloss";
  if(gl.detail){
    app.innerHTML=`<button type="button" class="back" id="gback">← 用語集の一覧へ</button>${detailHTML(GMAP[gl.detail],"data-gid")}`;
    document.getElementById("gback").onclick=()=>{gl.detail=null;renderGloss()};
    app.querySelectorAll("[data-gid]").forEach(b=>b.onclick=()=>{gl.detail=b.dataset.gid;renderGloss();window.scrollTo(0,0)});
    return;
  }
  const n=glossCount();
  app.innerHTML=`<button type="button" class="back" id="ghome">← はじめの画面へ</button>
  <h2>用語集</h2>
  <div class="gprog"><span>解放 <b>${n}</b> / ${GLOSSARY.length}</span><div class="ash"><i style="width:${n/GLOSSARY.length*100}%"></i></div></div>
  <p class="ghint">クイズに出てきた言葉が、答えるたびにここへ加わっていきます。</p>
  <input type="search" id="gq" class="gsearch" placeholder="解放済みの用語を探す(用語・よみがな)" value="${esc(gl.query)}" autocomplete="off" enterkeyhint="search">
  <div class="seg"><button type="button" data-m="cat" aria-pressed="${gl.mode==="cat"}">カテゴリ</button><button type="button" data-m="kana" aria-pressed="${gl.mode==="kana"}">五十音</button></div>
  <div id="gtabs"></div><div id="glist"></div>`;
  document.getElementById("ghome").onclick=intro;
  const q=document.getElementById("gq");q.oninput=()=>{gl.query=q.value;renderList()};
  app.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{gl.mode=b.dataset.m;app.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));renderList()});
  renderList();
}
function itemHTML(t){
  return unlocked.has(t.id)
    ?`<li><button type="button" class="gi" data-gid="${t.id}"><span class="gw2">${esc(t.w)}</span><span class="gr2">${esc(t.r)}</span><span class="gs2">${esc(t.s)}</span></button></li>`
    :`<li><div class="gi locked"><span class="gw2">？？？</span><span class="gr2">「${t.r[0]}」から始まる言葉 · ${t.cat}</span></div></li>`;
}
function renderList(){
  const tabs=document.getElementById("gtabs"),box=document.getElementById("glist");
  const qy=gl.query.trim();
  if(qy){
    tabs.innerHTML="";
    const k=toHira(qy.toLowerCase());
    const hits=GLOSSARY.filter(t=>unlocked.has(t.id)&&(t.w.toLowerCase().includes(qy.toLowerCase())||toHira(t.w).includes(k)||t.r.includes(k))).sort(byKana);
    box.innerHTML=hits.length?`<ul class="glist">${hits.map(itemHTML).join("")}</ul>`:`<p class="gempty">解放済みの用語には見つかりませんでした。</p>`;
  }else if(gl.mode==="cat"){
    tabs.innerHTML=`<div class="tabs">${GCATS.map(c=>{const all=GLOSSARY.filter(t=>t.cat===c);return `<button type="button" class="tab" data-c="${c}" aria-pressed="${c===gl.cat}">${c}<small>${all.filter(t=>unlocked.has(t.id)).length}/${all.length}</small></button>`}).join("")}</div>`;
    tabs.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{gl.cat=b.dataset.c;renderList()});
    box.innerHTML=`<ul class="glist">${GLOSSARY.filter(t=>t.cat===gl.cat).sort(byKana).map(itemHTML).join("")}</ul>`;
  }else{
    tabs.innerHTML="";
    const groups={};GLOSSARY.slice().sort(byKana).forEach(t=>{(groups[kanaRow(t.r)]=groups[kanaRow(t.r)]||[]).push(t)});
    box.innerHTML=Object.keys(groups).map(g=>`<h3 class="grow">${g}行</h3><ul class="glist">${groups[g].map(itemHTML).join("")}</ul>`).join("");
  }
  box.querySelectorAll("[data-gid]").forEach(b=>b.onclick=()=>{gl.detail=b.dataset.gid;renderGloss();window.scrollTo(0,0)});
}
// クイズ画面などから開く小窓
const modal=document.getElementById("modal"),mbody=document.getElementById("mbody");let mReturn=null;
function openTerm(id){
  if(!GMAP[id]||!unlocked.has(id))return;
  if(modal.hidden)mReturn=document.activeElement;
  mbody.innerHTML=detailHTML(GMAP[id],"data-term");
  modal.hidden=false;document.documentElement.classList.add("lock");
  document.getElementById("mclose").focus();
}
function closeTerm(){modal.hidden=true;document.documentElement.classList.remove("lock");if(mReturn&&mReturn.focus)mReturn.focus()}
document.getElementById("mclose").onclick=closeTerm;
modal.addEventListener("click",e=>{if(e.target===modal)closeTerm()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!modal.hidden)closeTerm()});
document.addEventListener("click",e=>{const b=e.target.closest("[data-term]");if(b){e.preventDefault();openTerm(b.dataset.term)}});

function intro(){
  app.className="card intro";
  app.innerHTML=`<h2>グラスを片手に、<br>紫煙の教養をひとつずつ。</h2>
  <p>葉巻、パイプ、キセル、そしてたばこの歴史。全${POOL.length}問の中から、今宵の10問をお出しします。まだお出ししていない問題から順に、4択と○×を織り交ぜて。一問ごとに短い解説を添えています。</p>
  <div class="rule">今宵の一杯を選ぶ</div>
  <div class="diffs">${[1,2,3].map(d=>{const b=store.get("kemuri-best-"+d);return `<button class="dbtn" data-d="${d}"><span class="dl">${LV[d]}</span><span class="ds">${LVSUB[d]}</span><span class="dn">${POOL.filter(q=>q.d===d).length}問 · ${b?`ベスト ${b}/${N}`:"未挑戦"}</span></button>`}).join("")}</div>
  <button type="button" class="btn ghost gbtn" id="glbtn"><span>用語集</span><span class="gcount">解放 ${glossCount()} / ${GLOSSARY.length}</span></button>`;
  app.querySelectorAll(".dbtn").forEach(b=>b.onclick=()=>start(+b.dataset.d));
  document.getElementById("glbtn").onclick=glossary;
}
let seenMem=null;
function loadSeen(){if(seenMem)return seenMem;try{seenMem=JSON.parse(store.get("kemuri-seen")||"[]")}catch(e){seenMem=[]}return seenMem}
function start(d){
  if(d)diff=d;
  const pool=POOL.filter(q=>q.d===diff);
  let seen=new Set(loadSeen());
  const fresh=shuffle(pool.filter(q=>!seen.has(q.id)));
  if(fresh.length>=N){qs=fresh.slice(0,N);qs.forEach(q=>seen.add(q.id))}
  else{ // 未出題が足りないときは残りを全部出して、この難易度の新しい周回を始める
    const rest=shuffle(pool.filter(q=>seen.has(q.id))).slice(0,N-fresh.length);
    qs=shuffle(fresh.concat(rest));
    pool.forEach(q=>seen.delete(q.id));qs.forEach(q=>seen.add(q.id));
  }
  seenMem=[...seen];store.set("kemuri-seen",JSON.stringify(seenMem));
  // 4択は毎回選択肢の並びをシャッフルする
  qs=qs.map(q=>{if(q.t!=="4")return q;const o=shuffle(q.c.map((c,n)=>({c,n})));return {...q,c:o.map(x=>x.c),a:o.findIndex(x=>x.n===q.a)}});
  i=0;score=0;log=[];freshTerms=[];show();
}
function show(){
  const q=qs[i], ox=q.t==="ox", opts=ox?["○","×"]:q.c;
  app.className="card";
  app.innerHTML=`<div class="meta"><span>${LV[diff]} · 第${i+1}問 / ${N}</span><span class="tag">${ox?"○×":"4択"}</span></div>
  <div class="ash"><i style="width:${(i/N)*100}%"></i></div>
  <div class="qbox"><span class="genre">${q.g}</span><p class="q">${esc(q.q)}</p></div>
  <div class="choices ${ox?"ox":""}">${opts.map((o,k)=>`<button class="ch" data-k="${k}" aria-label="${ox?(k?"バツ":"マル"):esc(o)}">${esc(o)}</button>`).join("")}</div>
  <div id="fb"></div>`;
  app.querySelectorAll(".ch").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
}
function answer(k){
  const q=qs[i], ok=k===q.a; if(ok)score++;
  log.push({q,ok,k});
  app.querySelectorAll(".ch").forEach(b=>{const n=+b.dataset.k;b.disabled=true;
    if(n===q.a)b.classList.add("right");else if(n===k)b.classList.add("wrong");else b.classList.add("dim")});
  const fb=document.getElementById("fb");fb.className="fb "+(ok?"ok":"ng");
  const added=unlockFrom(q);
  fb.innerHTML=`<strong>${pick(ok?OKS:NGS)}</strong><span class="lbl">解説</span><p>${markup(q.e)}</p>
  ${added.length?`<div class="newterm">用語集に加わりました:${added.map(id=>chipHTML(id,"data-term")).join("")}</div>`:""}
  <button class="btn" id="nx">${i+1<N?"次の一問へ":"今宵の結果を見る"}</button>`;
  const nx=document.getElementById("nx");nx.focus();nx.onclick=()=>{i++;i<N?show():result()};
}
function lbl(q,n){return q.t==="ox"?(n?"×":"○"):esc(q.c[n])}
function cigarSVG(frac){
  const w=300, burn=Math.round(w*(1-frac*0.85));
  return `<svg class="cigar" viewBox="0 0 320 26" aria-hidden="true">
  <rect x="10" y="5" width="${burn-10}" height="16" rx="8" fill="#6b4a2f"/>
  <rect x="${Math.max(30,burn*0.25)}" y="4" width="34" height="18" fill="#b8892f"/>
  <rect x="${burn}" y="5" width="${310-burn}" height="16" fill="#9b8b7c"/>
  <rect x="${burn-3}" y="5" width="5" height="16" fill="#d8643a"/></svg>`;
}
function result(){
  const bk="kemuri-best-"+diff, best=Math.max(score,+(store.get(bk)||0));store.set(bk,best);
  const r=RANKS.find(x=>score>=x.min);
  app.className="card result";
  app.innerHTML=`<div class="rank"><div class="score">${score}<small> / ${N}</small></div>
  ${cigarSVG(score/N)}<div class="name">${r.name}級</div><div class="spec">${r.spec}</div><p class="say">${r.say}</p>
  <div class="best">難易度「${LV[diff]}」の自己ベスト ${best} / ${N}</div></div>
  <div class="fresh"><h2>今回新しく解放された用語</h2>
  ${freshTerms.length?`<div class="chips">${freshTerms.map(id=>chipHTML(id,"data-term")).join("")}</div><p class="ghint">タップすると解説が開きます。用語集 解放 ${glossCount()} / ${GLOSSARY.length}</p>`:`<p class="ghint">今回は新しい用語はありませんでした。用語集 解放 ${glossCount()} / ${GLOSSARY.length}</p>`}</div>
  <h2>ふりかえり</h2>
  <ul class="review">${log.map(l=>`<li><span class="mk" style="color:${l.ok?"var(--ok)":"var(--ng)"}">${l.ok?"○":"×"}</span><span>${esc(l.q.q)}<br><span style="color:var(--muted)">${l.ok?"":`あなたの答え:${lbl(l.q,l.k)} / `}正解:${lbl(l.q,l.q.a)}</span></span></li>`).join("")}</ul>
  <div class="row"><button class="btn" id="re">もう一本</button><button class="btn ghost" id="top">難易度を選び直す</button></div>`;
  document.getElementById("re").onclick=()=>start();document.getElementById("top").onclick=intro;
}
/* ジャズBGM: Web Audioでその場で合成する。エレピのコンプ、ウォーキングベース、ブラシとライド、まばらなヴィブラフォン、レコードのノイズ */
const Jazz=(()=>{
  let ctx=null,master=null,noise=null,timer=null,bar=0,nextT=0,playing=false;
  const BPM=78, BEAT=60/BPM, SW=2/3;
  // [ベースのルート, エレピのボイシング, マイナーか]  F調の8小節ループ
  const PROG=[[41,[57,60,64,67],0],[38,[54,60,64,69],0],[43,[58,62,65,69],1],[36,[58,64,69,74],0],
              [45,[55,60,64,67],1],[38,[54,57,60,64],0],[43,[53,58,62,65],1],[36,[52,58,62,69],0]];
  const hz=m=>440*Math.pow(2,(m-69)/12);
  function env(g,t,a,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec)}
  function tone(type,f,t,a,peak,dec,dest){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;env(g,t,a,peak,dec);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+a+dec+0.05)}
  function ep(m,t,dur,v){tone("sine",hz(m),t,0.01,v,dur);tone("sine",hz(m)*2,t,0.005,v*0.16,dur*0.5);tone("triangle",hz(m)*3.01,t,0.003,v*0.04,0.25)}
  function bass(m,t,dur){const f=ctx.createBiquadFilter();f.type="lowpass";f.frequency.value=650;f.connect(master);tone("triangle",hz(m),t,0.012,0.42,dur,f);tone("sine",hz(m),t,0.01,0.25,dur*0.8,f)}
  function hit(t,type,freq,q,v,dur){const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=noise;f.type=type;f.frequency.value=freq;f.Q.value=q;env(g,t,0.004,v,dur);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*0.8);s.stop(t+dur+0.05)}
  function vib(m,t){tone("sine",hz(m),t,0.006,0.09,1.6);tone("sine",hz(m)*4,t,0.003,0.012,0.3)}
  function init(){
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
    ctx=new AC();
    const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=4800;lp.connect(ctx.destination);
    master=ctx.createGain();master.gain.value=0;master.connect(lp);
    noise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=noise.getChannelData(0);for(let k=0;k<d.length;k++)d[k]=Math.random()*2-1;
    const cb=ctx.createBuffer(1,ctx.sampleRate*4,ctx.sampleRate),c=cb.getChannelData(0);
    for(let k=0;k<c.length;k++)c[k]=Math.random()<0.0003?(Math.random()*2-1)*0.5:(Math.random()*2-1)*0.003;
    const cr=ctx.createBufferSource(),cg=ctx.createGain();cr.buffer=cb;cr.loop=true;cg.gain.value=0.4;cr.connect(cg);cg.connect(master);cr.start();
    return true;
  }
  function scheduleBar(t,b){
    const [r,v,minor]=PROG[b%8], nr=PROG[(b+1)%8][0];
    const walk=[r,r+(minor?3:4),r+7,nr+(Math.random()<0.5?1:-1)];
    if(Math.random()<0.3)walk[2]=r+(minor?3:4)+2;
    walk.forEach((m,q)=>bass(m,t+q*BEAT,BEAT*0.95));
    v.forEach(m=>ep(m,t,1.4,0.045));
    v.forEach(m=>ep(m,t+BEAT*(1+SW),0.6,0.035));
    if(Math.random()<0.4)v.forEach(m=>ep(m,t+BEAT*(2+SW),0.5,0.028));
    for(let q=0;q<4;q++){
      hit(t+q*BEAT,"highpass",7500,0.7,0.035,0.28);
      if(q===1||q===3){hit(t+(q+SW)*BEAT,"highpass",7500,0.7,0.022,0.16);hit(t+q*BEAT,"bandpass",2200,0.6,0.05,0.2)}
    }
    tone("sine",62,t,0.005,0.18,0.25);
    for(let e=0;e<8;e++){
      if(Math.random()<0.2){const m=v[Math.floor(Math.random()*v.length)];vib(m+12>81?m:m+12,t+Math.floor(e/2)*BEAT+(e%2?BEAT*SW:0))}
    }
  }
  function tick(){while(nextT<ctx.currentTime+1.5){scheduleBar(nextT,bar);nextT+=4*BEAT;bar++}}
  return {
    get on(){return playing},
    start(){
      if(!ctx&&!init())return false;
      if(ctx.resume)ctx.resume();
      nextT=ctx.currentTime+0.15;bar=0;tick();timer=setInterval(tick,200);
      master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setTargetAtTime(0.32,ctx.currentTime,0.8);
      playing=true;return true;
    },
    stop(){
      if(!ctx)return;playing=false;clearInterval(timer);
      master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setTargetAtTime(0,ctx.currentTime,0.3);
      setTimeout(()=>{if(!playing&&ctx.suspend)ctx.suspend()},1500);
    }
  };
})();
const bgmBtn=document.getElementById("bgm"),bgmLbl=document.getElementById("bgmlbl");
bgmBtn.onclick=()=>{
  if(Jazz.on){Jazz.stop()}else if(!Jazz.start()){bgmLbl.textContent="この端末ではBGMを再生できません";return}
  bgmBtn.setAttribute("aria-pressed",Jazz.on);bgmLbl.textContent=Jazz.on?"ジャズ BGM オン":"ジャズ BGM オフ";
};
intro();
</script>
