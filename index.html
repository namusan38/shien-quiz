<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>紫煙クイズ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 一列のカード。葉巻のバンド(帯)を見出しに使い、ヒュミドールの杉材の色で包む。単一のダークテーマ */
:root{
  --bg:#1d1612;          /* ヒュミドール内側 */
  --panel:#2a201a;       /* 杉材の板 */
  --line:#4a3a2e;
  --fg:#efe4d4;          /* 灰色がかった紙 */
  --muted:#b3a08b;
  --band:#b8892f;        /* 葉巻バンドの金 */
  --band-ink:#2a1a0c;
  --ember:#d8643a;       /* 火口 */
  --ok:#7fae6e;
  --ng:#d8643a;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.7;
  background-image:repeating-linear-gradient(90deg,transparent 0 7px,rgba(255,220,180,.018) 7px 8px);}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
.band{position:relative;background:linear-gradient(180deg,#d3a548,var(--band) 45%,#94681f);color:var(--band-ink);
  border-radius:4px;padding:14px 18px;text-align:center;box-shadow:inset 0 0 0 2px rgba(42,26,12,.35),inset 0 0 0 5px rgba(255,236,190,.25)}
.band h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,40px);letter-spacing:.12em;line-height:1.2}
.band .sub{font-size:11px;letter-spacing:.3em;font-weight:700;opacity:.8}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:16px}
.intro p{margin:0;color:var(--muted)}
.intro h2,.result h2{margin:0;font-family:var(--display);font-size:22px;text-wrap:balance}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{font-size:11px;font-weight:700;letter-spacing:.12em;padding:2px 10px;border-radius:999px;border:1px solid var(--band);color:var(--band)}
.ash{height:6px;border-radius:3px;background:#3a2d24;overflow:hidden;position:relative}
.ash i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#8d7b6c,#c9bcae);transition:width .3s}
.ash i::after{content:"";position:absolute;right:0;top:0;bottom:0;width:6px;background:var(--ember);box-shadow:0 0 8px var(--ember)}
.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dbtn{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;transition:border-color .15s}
.dbtn:hover{border-color:var(--band)}
.dbtn:focus-visible{outline:2px solid var(--band);outline-offset:2px}
.dbtn .dl{font-family:var(--display);font-size:20px;font-weight:800;color:var(--band)}
.dbtn .dn{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.qbox{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.genre{font-size:12px;font-weight:700;letter-spacing:.1em;padding:3px 10px;border:1px solid var(--band);border-radius:6px;background:rgba(184,137,47,.15);color:var(--fg)}
.q{font-family:var(--display);font-size:20px;font-weight:600;line-height:1.6;margin:0;text-wrap:pretty}
.choices{display:grid;gap:10px}
.choices.ox{grid-template-columns:1fr 1fr}
button{font:inherit;cursor:pointer}
.ch{text-align:left;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-height:48px;transition:border-color .15s,background .15s}
.ox .ch{text-align:center;font-family:var(--display);font-size:34px;line-height:1;padding:16px}
.ch:hover:not(:disabled){border-color:var(--band)}
.ch:focus-visible,.btn:focus-visible{outline:2px solid var(--band);outline-offset:2px}
.ch:disabled{cursor:default}
.ch.right{border-color:var(--ok);background:rgba(127,174,110,.14)}
.ch.wrong{border-color:var(--ng);background:rgba(216,100,58,.14)}
.ch.dim{opacity:.45}
.fb{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.fb strong{font-size:15px}
.fb.ok strong{color:var(--ok)} .fb.ng strong{color:var(--ng)}
.fb p{margin:0;color:var(--muted);font-size:14px}
.btn{background:var(--band);color:var(--band-ink);border:0;border-radius:6px;padding:14px;font-weight:700;letter-spacing:.08em;min-height:48px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1 1 140px}
.rank{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0}
.rank .score{font-family:var(--display);font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.rank .score small{font-size:22px;color:var(--muted)}
.rank .name{font-family:var(--display);font-size:22px;color:var(--band)}
.rank .spec{font-size:12px;color:var(--muted);letter-spacing:.08em}
.cigar{width:100%;max-width:320px;height:26px;margin:4px 0}
.review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.review li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.review li span:last-child{min-width:0}
.review .mk{font-weight:700}
.note{font-size:12px;color:var(--muted);text-align:center;margin:0}
.best{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="band"><div class="sub">FOR AFICIONADOS</div><h1>紫煙クイズ</h1><div class="sub">CIGAR · PIPE · KISERU</div></header>

</div>

 {t:"4",q:"葉巻工場で、作業する巻き手に新聞や小説を読み聞かせる人を何と呼ぶ?",c:["トルセドール","レクトール","カタドール","ベゲーロ"],a:1,e:"レクトール(朗読者)。巻き手そのものはトルセドールと呼ばれます。"},

 {t:"ox",q:"ヒュミドール管理の目安として「70/70ルール」(華氏70度・湿度70%)がよく知られている。",a:0,e:"華氏70度は約21℃。好みや季節で65%前後に下げる人もいます。"},

 {g:"葉巻",t:"4",q:"「パルタガス セリーD No.4」はどのサイズの代表格?",c:["コロナ","ロブスト","チャーチル","パナテラ"],a:1,e:"ロブストの定番として、世界中の愛好家に知られる1本です。"},
 {g:"葉巻",t:"4",q:"「モンテクリスト No.2」は、どんな形の葉巻?",c:["先が尖ったトルペード","細長いパナテラ","太く短いロブスト","円筒形のコロナ"],a:0,e:"キューバではピラミデとも呼ばれる、先端が尖った形の名作です。"},
 {g:"葉巻",t:"ox",q:"「パナテラ」は、太く短い葉巻のサイズ名である。",a:1,e:"パナテラは細長いサイズ。軽やかに吸えるのが持ち味です。"},
 {g:"葉巻",t:"4",q:"キューバ葉巻の箱に記される、完全な手巻きを示すスペイン語表記は?",c:["Totalmente a mano","Hecho a máquina","Puro natural","Gran reserva"],a:0,e:"「すべて手で」の意味。キューバのプレミアムシガーの証です。"},
 {g:"葉巻",t:"ox",q:"葉巻の灰が長く崩れずに保たれるのは、一般に巻きの良さのしるしとされる。",a:0,e:"フィラーが均一に詰まっていると、灰がしっかりと長く残ります。"},
 {g:"葉巻",t:"4",q:"ブランド名「オヨ・デ・モントレー」の「オヨ(Hoyo)」の意味は?",c:["王冠","窪地","川","丘"],a:1,e:"スペイン語で穴や窪地のこと。ブエルタ・アバホの畑の地形に由来します。"},
 {g:"パイプ",t:"4",q:"パイプで、本格的に火をつける前に表面を軽くあぶる最初の点火を何と呼ぶ?",c:["チャーリングライト","トゥルーライト","ドライボックス","リライト"],a:0,e:"チャーリングライトで表面を焦がして整え、タンパーで押さえてから本点火します。"},
 {g:"パイプ",t:"ox",q:"パイプは吸い終わったら、熱いうちにすぐステムを抜いて掃除するのがよい。",a:1,e:"熱いうちに抜くとシャンクを傷めやすいので、冷めてから外すのが基本です。"},
 {g:"パイプ",t:"4",q:"「チャーチワーデン」と呼ばれるパイプの特徴は?",c:["とても長いステム","陶器の火皿","二重の火皿","金属製のボウル"],a:0,e:"30cm前後にもなる長いステムで、煙が冷えて口当たりが柔らかくなります。"},
 {g:"パイプ",t:"ox",q:"パイプは複数本を持ち、1本ずつ休ませながらローテーションするとよいとされる。",a:0,e:"使ったあと1日以上休ませると、湿気が抜けて味が落ちにくくなります。"},
 {g:"パイプ",t:"4",q:"パイプブランド「スタンウェル」はどこの国のメーカー?",c:["イギリス","イタリア","デンマーク","アメリカ"],a:2,e:"デンマーク。自由な造形のデニッシュパイプの代表的なブランドです。"},
 {g:"パイプ",t:"4",q:"パイプの掃除に使う、針金に綿を巻いたブラシの日本での通称は?",c:["モール","リーマー","タンパー","スピル"],a:0,e:"モール(パイプクリーナー)。ステムやシャンクの中の湿気やヤニを取ります。"},
 {g:"キセル",t:"4",q:"羅宇を使わず、全体が一本の金属でできたキセルを何と呼ぶ?",c:["延べ煙管","羅宇煙管","長煙管","刻み煙管"],a:0,e:"延べ煙管。丈夫で、装飾を凝らしたものも多く作られました。"},
 {g:"キセル",t:"ox",q:"「たばこ盆」は、火入れや灰吹きなどをのせた喫煙道具一式の台である。",a:0,e:"客をもてなす道具でもあり、座敷に置かれていました。"},
 {g:"キセル",t:"4",q:"たばこ盆で、キセルの灰を落とす竹筒を何と呼ぶ?",c:["火入れ","灰吹き","根付","煙草入れ"],a:1,e:"灰吹き。キセルの雁首を縁に軽く当てて灰を落とします。"},
 {g:"キセル",t:"ox",q:"腰に提げるたばこ入れを帯に留めるための小さな留め具が「根付」である。",a:0,e:"根付は精巧な彫刻が施されたものも多く、美術品として集められています。"},
 {g:"たばこ葉",t:"4",q:"トルコやギリシャなどで育つ、香り高い小ぶりな葉の総称は?",c:["オリエント葉","バーレー葉","バージニア葉","ペリク"],a:0,e:"オリエント葉。アメリカンブレンドの紙巻きにも香りづけとして使われます。"},
 {g:"たばこ葉",t:"ox",q:"バージニア葉は、糖分が多く甘みのある味わいが特徴とされる。",a:0,e:"熱風乾燥(フルーキュア)で糖分が残り、明るい色と甘みが出ます。"},
 {g:"たばこ葉",t:"4",q:"葉を加熱・圧縮して甘く柔らかに仕上げた、パイプたばこの製法の名前は?",c:["キャベンディッシュ","ラタキア","フレーク","シャグ"],a:0,e:"キャベンディッシュ。黒っぽく、着香されたものも多いのが特徴です。"},
 {g:"シーシャ",t:"4",q:"水たばこ(シーシャ)の、トルコでの一般的な呼び名は?",c:["ナルギレ","フーカー","スヌース","パイプ"],a:0,e:"ナルギレ。英語圏ではフーカー、アラブ圏ではシーシャと呼ばれることが多いです。"},
 {g:"シーシャ",t:"ox",q:"シーシャの加熱には、ヤシ殻から作るココナッツ炭がよく使われる。",a:0,e:"火力が安定し、匂いが少ないのが好まれる理由です。"},
 {g:"喫煙具",t:"4",q:"高級ライター「エス・テー・デュポン」はどこの国のブランド?",c:["イタリア","フランス","スイス","ドイツ"],a:1,e:"フランス。パリで生まれたラグジュアリーブランドです。"},
 {g:"喫煙具",t:"ox",q:"デュポンのライターは、ふたを開けたときの澄んだ金属音で知られる。",a:0,e:"「キーン」という開閉音は、ブランドの象徴として大切にされています。"},
 {g:"歴史",t:"4",q:"19世紀後半に、紙巻きたばこの自動巻上機を発明したのは?",c:["ジェームズ・ボンサック","ジェームズ・デューク","ジャン・ニコ","アルフレッド・ダンヒル"],a:0,e:"ボンサックの機械で大量生産が可能になり、紙巻きが一気に広まりました。"},
 {g:"歴史",t:"ox",q:"イングランド王ジェームズ1世は、たばこを批判する小冊子を書いたことで知られる。",a:0,e:"1604年の『たばこへの反論』。国王自ら喫煙を戒めた文書です。"},
 {g:"葉巻",t:"4",q:"葉巻の主な原料は?",c:["たばこの葉","紙","茶葉","麻"],a:0,e:"葉巻は中身から外側まで、すべてたばこの葉でできています。"},
 {g:"葉巻",t:"ox",q:"葉巻は英語で「シガー」と呼ばれる。",a:0,e:"cigar。紙巻きたばこは cigarette(シガレット)です。"},
 {g:"葉巻",t:"4",q:"葉巻の吸い口を切るための道具は?",c:["シガーカッター","タンパー","リーマー","モール"],a:0,e:"シガーカッター。タンパー、リーマー、モールはパイプの道具です。"},
 {g:"葉巻",t:"ox",q:"葉巻は紙巻きたばこと同じく、たばこの葉を紙で巻いて作られる。",a:1,e:"葉巻はいちばん外側もたばこの葉(ラッパー)で巻かれています。"},
 {g:"葉巻",t:"4",q:"キューバ葉巻の代名詞にもなっている、キューバの首都は?",c:["ハバナ","サンティアゴ・デ・クーバ","マイアミ","マドリード"],a:0,e:"ハバナ。キューバ葉巻は「ハバナ葉巻」とも呼ばれます。"},
 {g:"葉巻",t:"ox",q:"葉巻を湿度を保って保管するための箱を「ヒュミドール」と呼ぶ。",a:0,e:"乾燥すると味が落ちるので、湿度を一定に保って保管します。"},
 {g:"葉巻",t:"4",q:"葉巻に巻かれている、ブランド名入りの紙の帯を何と呼ぶ?",c:["シガーバンド","キャップ","フット","ラッパー"],a:0,e:"シガーバンド(リング)。ブランドや銘柄を見分ける目印です。"},
 {g:"パイプ",t:"4",q:"パイプで、たばこの葉を詰める部分は?",c:["ボウル(火皿)","ステム","シャンク","ビット"],a:0,e:"ボウル。ここに葉を詰めて火をつけます。"},
 {g:"パイプ",t:"ox",q:"コーンパイプは、トウモロコシの芯(穂軸)で作られている。",a:0,e:"軽くて安価なので、パイプの入門用としても人気です。"},
 {g:"パイプ",t:"4",q:"パイプで、口にくわえる側の細長い部分を何と呼ぶ?",c:["ステム","ボウル","リム","ヒール"],a:0,e:"ステム(マウスピース)。先端の口に当たる部分はビットと呼ばれます。"},
 {g:"キセル",t:"4",q:"「キセル」を漢字で書くと?",c:["煙管","煙草","喫管","吸筒"],a:0,e:"煙管。「煙草」は「たばこ」と読みます。"},
 {g:"キセル",t:"ox",q:"キセルは、一度にたくさんの葉を詰めて長時間吸う道具である。",a:1,e:"火皿は小さく、数服で吸い切っては詰め直して楽しみます。"},
 {g:"たばこ葉",t:"ox",q:"たばこの葉は、収穫後すぐには使わず、乾燥・熟成させてから使う。",a:0,e:"乾燥と熟成を経ることで、香りや味わいがまろやかになります。"},
 {g:"たばこ葉",t:"4",q:"たばこの葉に含まれ、依存性の原因となる成分は?",c:["ニコチン","カフェイン","タンニン","カテキン"],a:0,e:"ニコチン。カフェインはコーヒー、カテキンは緑茶に多い成分です。"},
 {g:"たばこ葉",t:"ox",q:"たばこは、もともとアメリカ大陸原産の植物である。",a:0,e:"南北アメリカが原産で、大航海時代に世界へ広まりました。"},
 {g:"シーシャ",t:"4",q:"シーシャで、煙をくぐらせて冷やすために容器に入れるものは?",c:["水","油","酒","砂"],a:0,e:"水。水たばこと呼ばれる理由です。"},
 {g:"シーシャ",t:"ox",q:"シーシャは、ホースを回して複数人で楽しむこともある。",a:0,e:"仲間と囲んでゆっくり楽しむ社交の道具でもあります。"},
 {g:"喫煙具",t:"4",q:"ガスやオイルを燃料にして火をつける道具は?",c:["ライター","タンパー","ヒュミドール","カッター"],a:0,e:"ライター。葉巻には炎の強いターボライターもよく使われます。"},
 {g:"喫煙具",t:"ox",q:"ジッポーは、主にガスを燃料にするライターである。",a:1,e:"ジッポーはオイルライター。綿に染み込ませたオイルを芯で吸い上げて燃やします。"},
 {g:"喫煙具",t:"4",q:"葉巻の点火に使われる、スギの薄い木片を何と呼ぶ?",c:["シダースピル","マッチ","モール","リーマー"],a:0,e:"シダースピル。箱に入っている仕切りの杉板を細く裂いて使うこともあります。"},
 {g:"歴史",t:"4",q:"「JT」は何の略?",c:["Japan Tobacco","Japan Trade","Japan Tea","Japan Travel"],a:0,e:"日本たばこ産業の英語名、Japan Tobacco Inc. の略です。"},
 {g:"マナー",t:"4",q:"日本の法律で、たばこを吸えるのは何歳から?",c:["18歳","20歳","21歳","16歳"],a:1,e:"20歳から。成年年齢は18歳に引き下げられましたが、喫煙と飲酒は20歳のままです。"},
 {g:"マナー",t:"ox",q:"改正健康増進法の全面施行(2020年4月)で、飲食店などは原則として屋内禁煙になった。",a:0,e:"喫煙専用室などを設けた場合を除き、多くの人が使う施設の屋内は原則禁煙です。"},
 {g:"マナー",t:"ox",q:"歩きながらたばこを吸う「歩きたばこ」は、多くの自治体で条例により禁止・規制されている。",a:0,e:"東京の千代田区など、路上喫煙に罰則つきで禁止区域を設けている自治体もあります。"},
 {g:"マナー",t:"ox",q:"葉巻やパイプは、たばこ製品には含まれない。",a:1,e:"葉巻もパイプたばこも、法律上はたばこ製品です。"},
 // ここから全150問化で追加(d: 1=簡単 2=普通 3=難しい)
 {d:1,g:"葉巻",t:"ox",q:"葉巻は、キューバの名産品として有名である。",a:0,e:"ハバナ葉巻は世界中の愛好家に知られるキューバの代表的な特産品です。"},
 {d:1,g:"葉巻",t:"4",q:"葉巻で、火をつける側の先端を何と呼ぶ?",c:["フット","キャップ","バンド","ラッパー"],a:0,e:"フット。反対側の吸い口はヘッドで、そこをふさいでいる葉がキャップです。"},
 {d:1,g:"葉巻",t:"ox",q:"プレミアムシガーには、1本ずつ手で巻かれたものが多い。",a:0,e:"高級な葉巻の多くは、熟練の巻き手による手巻きです。"},
 {d:1,g:"パイプ",t:"ox",q:"パイプたばこは、パイプの火皿に詰めて火をつけて吸う。",a:0,e:"葉を火皿に詰め、ゆっくり燃やして香りを楽しみます。"},
 {d:1,g:"パイプ",t:"4",q:"パイプを愛用したことで有名な、小説の名探偵は?",c:["シャーロック・ホームズ","エルキュール・ポアロ","明智小五郎","金田一耕助"],a:0,e:"ホームズ。難事件を「パイプ3服分の問題」と呼ぶ場面もあります。"},
 {d:1,g:"キセル",t:"ox",q:"キセルは、日本の伝統的な喫煙具である。",a:0,e:"江戸時代に広く普及し、刻みたばこを詰めて吸いました。"},
 {d:1,g:"歴史",t:"4",q:"たばこ「キャメル」のパッケージに描かれている動物は?",c:["ラクダ","ゾウ","ライオン","ウマ"],a:0,e:"キャメルは英語でラクダ。ヒトコブラクダの絵がトレードマークです。"},
 {d:1,g:"歴史",t:"4",q:"たばこ「アメリカンスピリット」のパッケージに描かれている人物は?",c:["パイプをくわえたネイティブアメリカン","帽子をかぶったカウボーイ","ひげの船乗り","ヨーロッパの貴族"],a:0,e:"羽根飾りをつけたネイティブアメリカンが、長いパイプをくわえる姿が描かれています。"},
 {d:1,g:"葉巻",t:"ox",q:"葉巻は、吸い口をカットしてから火をつけるのが一般的である。",a:0,e:"吸い口はキャップでふさがれているので、カッターで開けてから火をつけます。"},
 {d:1,g:"パイプ",t:"ox",q:"パイプは木だけでなく、トウモロコシの芯や鉱物など、さまざまな素材で作られる。",a:0,e:"ブライヤー(木)、コーン(トウモロコシ)、メシャム(鉱物)などがあります。"},
 {d:1,g:"喫煙具",t:"ox",q:"ガスライターの燃料には、主にブタンガスが使われる。",a:0,e:"ブタンガス。葉巻用のライターも、ほとんどがブタンガスを使います。"},
 {d:1,g:"歴史",t:"4",q:"たばこ「ラッキーストライク」のパッケージで有名なマークは?",c:["赤い丸","青い星","金の鳩","緑の三角"],a:0,e:"白地に赤い丸のマーク。的(まと)のようなデザインで知られます。"},
 {d:1,g:"歴史",t:"4",q:"たばこ「ピース」のパッケージに描かれている鳥は?",c:["ハト","ワシ","ツル","カラス"],a:0,e:"平和(ピース)の象徴であるハトが、オリーブの枝をくわえています。"},
 {d:1,g:"歴史",t:"4",q:"たばこ「マイルドセブン」は、2013年に何という名前に変わった?",c:["メビウス","セブンスター","ピアニッシモ","ケント"],a:0,e:"メビウス(MEVIUS)。マイルドセブンのMとSevenのVを受け継いだ名前です。"},
 {d:1,g:"歴史",t:"ox",q:"「ハイライト」は、日本で発売されているたばこの銘柄である。",a:0,e:"1960年発売のロングセラー。青いパッケージでおなじみです。"},
 {d:1,g:"マナー",t:"ox",q:"加熱式たばこも、改正健康増進法の規制の対象になっている。",a:0,e:"加熱式たばこも屋内では原則禁煙です。専用の喫煙室なら飲食しながら吸える場合もあります。"},
 {d:1,g:"たばこ葉",t:"4",q:"収穫して乾燥させたたばこの葉は、主に何色になる?",c:["茶色","青色","白色","赤色"],a:0,e:"緑の葉は乾燥と熟成で、黄色から茶色に変わっていきます。"},
 {d:2,g:"葉巻",t:"4",q:"太く短い葉巻のサイズの代表は?",c:["ロブスト","パナテラ","ランセロ","ペティコロナ"],a:0,e:"ロブスト。太さのわりに短く、30〜45分ほどで濃い味を楽しめます。"},
 {d:2,g:"葉巻",t:"ox",q:"葉巻は、湿度が高すぎるとカビが生えることがある。",a:0,e:"高すぎても低すぎてもよくないので、ヒュミドールで湿度を一定に保ちます。"},
 {d:2,g:"葉巻",t:"4",q:"葉巻ブランド「H.アップマン」の創業者ヘルマン・アップマンの本業は?",c:["銀行家","医師","船長","画家"],a:0,e:"ドイツの銀行家で、ハバナに支店を開き、のちに葉巻工場を立ち上げました。"},
 {d:2,g:"パイプ",t:"4",q:"パイプの火皿にたまったケーキを削る道具は?",c:["リーマー","タンパー","モール","カッター"],a:0,e:"リーマー。ケーキを薄く保つことで火皿の割れを防ぎます。"},
 {d:2,g:"パイプ",t:"ox",q:"湿りすぎたパイプたばこは、詰める前に少し乾かすと燃えやすくなる。",a:0,e:"広げて少し置くと、火がつきやすく舌を荒らしにくくなります。"},
 {d:2,g:"キセル",t:"4",q:"キセルで、たばこを詰める火皿がついた先端の金属部分を何と呼ぶ?",c:["雁首","羅宇","吸口","根付"],a:0,e:"雁首(がんくび)。形が雁の首に似ていることから名付けられました。"},
 {d:2,g:"たばこ葉",t:"4",q:"バージニア、バーレー、オリエントの葉を混ぜた紙巻きたばこのブレンドを何と呼ぶ?",c:["アメリカンブレンド","イングリッシュミクスチャー","バージニアストレート","ラタキアブレンド"],a:0,e:"アメリカンブレンド。日本の紙巻きたばこにも多いタイプです。"},
 {d:2,g:"喫煙具",t:"4",q:"オイルライター「ジッポー」が掲げている製品保証は?",c:["永久保証","1年保証","10年保証","保証なし"],a:0,e:"永久保証。使用年数を問わず修理を受け付けることで知られています。"},
 {d:2,g:"歴史",t:"4",q:"日本語の「たばこ」は、主に何語から来た言葉とされる?",c:["ポルトガル語","英語","オランダ語","中国語"],a:0,e:"ポルトガル語の tabaco から。南蛮貿易とともに伝わりました。"},

const N=10, app=document.getElementById("app");
let qs=[],i=0,score=0,log=[],diff=2;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function shuffle(a){a=a.slice();for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function intro(){
  app.className="card intro";
  app.innerHTML=`<h2>葉巻、パイプ、キセル。<br>あなたの紫煙通ぶりを試す10問。</h2>

  <div class="diffs">${[1,2,3].map(d=>{const b=store.get("kemuri-best-"+d);return `<button class="dbtn" data-d="${d}"><span class="dl">${LV[d]}</span><span class="dn">${POOL.filter(q=>q.d===d).length}問</span><span class="dn">${b?`ベスト ${b}/${N}`:"未挑戦"}</span></button>`}).join("")}</div>`;
  app.querySelectorAll(".dbtn").forEach(b=>b.onclick=()=>start(+b.dataset.d));
}
let seenMem=null;
function loadSeen(){if(seenMem)return seenMem;try{seenMem=JSON.parse(store.get("kemuri-seen")||"[]")}catch(e){seenMem=[]}return seenMem}
function start(d){
  if(d)diff=d;
  const pool=POOL.filter(q=>q.d===diff);
  let seen=new Set(loadSeen());
  const fresh=shuffle(pool.filter(q=>!seen.has(q.id)));
  if(fresh.length>=N){qs=fresh.slice(0,N);qs.forEach(q=>seen.add(q.id))}
  else{ // 未出題が足りないときは残りを全部出して、この難易度の新しい周回を始める
    const rest=shuffle(pool.filter(q=>seen.has(q.id))).slice(0,N-fresh.length);
    qs=shuffle(fresh.concat(rest));
    pool.forEach(q=>seen.delete(q.id));qs.forEach(q=>seen.add(q.id));
  }
  seenMem=[...seen];store.set("kemuri-seen",JSON.stringify(seenMem));
  // 4択は毎回選択肢の並びをシャッフルする
  qs=qs.map(q=>{if(q.t!=="4")return q;const o=shuffle(q.c.map((c,n)=>({c,n})));return {...q,c:o.map(x=>x.c),a:o.findIndex(x=>x.n===q.a)}});
  i=0;score=0;log=[];show();
}
function show(){
  const q=qs[i], ox=q.t==="ox", opts=ox?["○","×"]:q.c;

  <div class="ash"><i style="width:${(i/N)*100}%"></i></div>
  <div class="qbox"><span class="genre">${q.g}</span><p class="q">${esc(q.q)}</p></div>
  <div class="choices ${ox?"ox":""}">${opts.map((o,k)=>`<button class="ch" data-k="${k}" aria-label="${ox?(k?"バツ":"マル"):esc(o)}">${esc(o)}</button>`).join("")}</div>
  <div id="fb"></div>`;
  app.querySelectorAll(".ch").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
}
function answer(k){
  const q=qs[i], ok=k===q.a; if(ok)score++;
  log.push({q,ok,k});
  app.querySelectorAll(".ch").forEach(b=>{const n=+b.dataset.k;b.disabled=true;
    if(n===q.a)b.classList.add("right");else if(n===k)b.classList.add("wrong");else b.classList.add("dim")});
  const fb=document.getElementById("fb");fb.className="fb "+(ok?"ok":"ng");
  fb.innerHTML=`<strong>${ok?"正解":"不正解"}</strong><p>${esc(q.e)}</p>
  <button class="btn" id="nx">${i+1<N?"次の問題":"結果を見る"}</button>`;
  const nx=document.getElementById("nx");nx.focus();nx.onclick=()=>{i++;i<N?show():result()};
}
function lbl(q,n){return q.t==="ox"?(n?"×":"○"):esc(q.c[n])}
function cigarSVG(frac){
  const w=300, burn=Math.round(w*(1-frac*0.85));
  return `<svg class="cigar" viewBox="0 0 320 26" aria-hidden="true">
  <rect x="10" y="5" width="${burn-10}" height="16" rx="8" fill="#6b4a2f"/>
  <rect x="${Math.max(30,burn*0.25)}" y="4" width="34" height="18" fill="#b8892f"/>
  <rect x="${burn}" y="5" width="${310-burn}" height="16" fill="#9b8b7c"/>
  <rect x="${burn-3}" y="5" width="5" height="16" fill="#d8643a"/></svg>`;
}
function result(){
  const bk="kemuri-best-"+diff, best=Math.max(score,+(store.get(bk)||0));store.set(bk,best);
  const r=RANKS.find(x=>score>=x.min);
  app.className="card result";
  app.innerHTML=`<div class="rank"><div class="score">${score}<small> / ${N}</small></div>
  ${cigarSVG(score/N)}<div class="name">${r.name}級</div><div class="spec">${r.spec}</div>
  <div class="best">難易度「${LV[diff]}」の自己ベスト ${best} / ${N}</div></div>
  <h2>ふりかえり</h2>
  <ul class="review">${log.map(l=>`<li><span class="mk" style="color:${l.ok?"var(--ok)":"var(--ng)"}">${l.ok?"○":"×"}</span><span>${esc(l.q.q)}<br><span style="color:var(--muted)">${l.ok?"":`あなたの答え:${lbl(l.q,l.k)} / `}正解:${lbl(l.q,l.q.a)}</span></span></li>`).join("")}</ul>
  <div class="row"><button class="btn" id="re">もう一本</button><button class="btn ghost" id="top">難易度を選び直す</button></div>`;
  document.getElementById("re").onclick=()=>start();document.getElementById("top").onclick=intro;
}
intro();
</script>
</body>
